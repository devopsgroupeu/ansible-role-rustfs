---
# ==============================================================================
# Orchestrator: include_tasks only, one tag per stage. The guards (validate
# and preflight) run first and are tagged always, so no tag selection can
# bypass them; they only read, so a host that fails one is left untouched.
# ==============================================================================

- name: Validate configuration variables
  ansible.builtin.include_tasks: validate.yml
  tags: always

- name: Check the host before changing it
  ansible.builtin.include_tasks: preflight.yml
  tags: always

# Render mode installs nothing (no user, no binary).
- name: Install RustFS
  ansible.builtin.include_tasks: install.yml
  when: not rustfs_config_only | bool
  tags: install

- name: Render configuration files and the systemd unit
  ansible.builtin.include_tasks: config.yml
  tags: config

- name: Generate or check TLS material
  ansible.builtin.include_tasks: tls.yml
  tags: tls

# Reload systemd for a changed unit before the service is managed.
- name: Flush handlers before service management
  ansible.builtin.meta: flush_handlers
  when: not rustfs_config_only | bool

# Start, restart (together or rolling) and enable; never in render mode.
- name: Manage the RustFS service
  ansible.builtin.include_tasks: service.yml
  when: not rustfs_config_only | bool
  tags: service
