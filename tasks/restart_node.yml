---
# ==============================================================================
# Rolling restart of one node (spec 8.3), included by service.yml with
# run_once and a loop, so nodes restart strictly one after another. Input:
#   __rustfs_node  inventory name of the node to restart
# The task context is the run_once host: every task delegates to the node and
# reads per-node values (peer URLs, main PID, node URL) through hostvars.
# Every failure message names the node.
# Peers (distributed only; a standalone node has none) are probed from the
# restarting node before and after its restart: all must be ready before it
# goes down, and afterwards each must stop listing more of its unavailable
# or missing drives than before (re-admission).
# Drive keys are "<poolIndex>/<setIndex>/<diskIndex>" of
# details.storage.unavailableDrives plus details.storage.missingDrives.
# ==============================================================================

- name: Probe the peers before restarting {{ __rustfs_node }}
  ansible.builtin.uri:
    url: "{{ item['url'] }}/health/ready"
    method: GET
    status_code: [200, 503]
    validate_certs: true
    ca_path: "{{ __rustfs_probe_ca_path | default(omit, true) }}"
  loop: "{{ hostvars[__rustfs_node]['__rustfs_peer_urls'] }}"
  loop_control:
    label: "{{ item['name'] }}"
  register: __rustfs_peer_before
  failed_when: false
  when: not ansible_check_mode
  delegate_to: "{{ __rustfs_node }}"
  check_mode: false
  changed_when: false
  tags: service

# A peer that is not ready refuses the restart of this node and of every
# node after it, so a bad change or a dead peer stops at one node at most.
# A ready peer without details.storage fails closed: re-admission could not
# be checked.
- name: Validate every peer is ready before restarting {{ __rustfs_node }}
  vars:
    __rustfs_peers_not_ready: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in __rustfs_peer_before['results'] | default([]) if r['item'] is defined -%}
      {%-   set details = (r['json'] | default({}))['details'] | default({}) -%}
      {%-   if r['status'] | default(-1) != 200 or not (r['json']['ready'] | default(false)) -%}
      {%-     set why = (r['json']['degradedReasons'] | default([]) | join(','))
                        if r['json'] is defined else (r['msg'] | default('') | truncate(120)) -%}
      {%-     set ns.out = ns.out + ['peer ' ~ r['item']['name'] ~ ' is not ready (status '
                                     ~ (r['status'] | default('none')) ~ (': ' ~ why if why else '') ~ ')'] -%}
      {%-   elif details['storage'] is not defined
             or details['storage']['unavailableDrives'] is not defined
             or details['storage']['missingDrives'] is not defined -%}
      {%-     set ns.out = ns.out + ['peer ' ~ r['item']['name'] ~ ' is not ready (no details.storage drive lists in its /health/ready answer)'] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.out }}
  ansible.builtin.assert:
    that:
      - __rustfs_peers_not_ready | length == 0
    fail_msg: >-
      refusing to restart {{ __rustfs_node }}: {{ __rustfs_peers_not_ready | join('; ') }}.
      Nothing was restarted on {{ __rustfs_node }} or after it. Fix the peer,
      or set rustfs_rolling_restart: false to restart all changed nodes
      together in a maintenance window.
    quiet: true
  when: not ansible_check_mode
  delegate_to: "{{ __rustfs_node }}"
  check_mode: false
  changed_when: false
  tags: service

- name: Record the drive baseline of the peers of {{ __rustfs_node }}
  ansible.builtin.set_fact:
    __rustfs_peer_baseline: >-
      {%- set ns = namespace(out={}) -%}
      {%- for r in __rustfs_peer_before['results'] | default([]) if r['item'] is defined -%}
      {%-   set drives = r['json']['details']['storage']['unavailableDrives']
                         + r['json']['details']['storage']['missingDrives'] -%}
      {%-   set keys = drives | map(attribute='poolIndex')
                       | zip(drives | map(attribute='setIndex'), drives | map(attribute='diskIndex'))
                       | map('join', '/') | list -%}
      {%-   set ns.out = ns.out | combine({r['item']['name']: keys}) -%}
      {%- endfor -%}
      {{ ns.out }}
  when: not ansible_check_mode
  delegate_to: "{{ __rustfs_node }}"
  check_mode: false
  changed_when: false
  tags: service

- name: Restart RustFS on {{ __rustfs_node }}
  ansible.builtin.systemd_service:
    name: rustfs
    state: restarted
    daemon_reload: true
    no_block: true
  delegate_to: "{{ __rustfs_node }}"
  tags: service

- name: Wait for the restarted node {{ __rustfs_node }}
  ansible.builtin.include_tasks: wait_ready.yml
  vars:
    __rustfs_wait_node: "{{ __rustfs_node }}"
    __rustfs_wait_old_pid: "{{ hostvars[__rustfs_node]['__rustfs_main_pid'] }}"
  tags: service

# A node's own /health/ready says it can reach the cluster, not that the
# cluster reaches it again: wait until no peer lists more unavailable or
# missing drives than in its baseline.
- name: Block until every peer re-admits {{ __rustfs_node }}
  when: not ansible_check_mode
  tags: service
  block:
    - name: Wait until every peer re-admits the drives of {{ __rustfs_node }}
      ansible.builtin.uri:
        url: "{{ item['url'] }}/health/ready"
        method: GET
        status_code: [200, 503]
        validate_certs: true
        ca_path: "{{ __rustfs_probe_ca_path | default(omit, true) }}"
      loop: "{{ hostvars[__rustfs_node]['__rustfs_peer_urls'] }}"
      loop_control:
        label: "{{ item['name'] }}"
      register: __rustfs_peer_after
      until: >-
        __rustfs_peer_after['status'] == 200
        and (__rustfs_peer_after['json']['ready'] | default(false))
        and (((__rustfs_peer_after['json']['details']['storage']['unavailableDrives'] | default([]))
              + (__rustfs_peer_after['json']['details']['storage']['missingDrives'] | default([])))
             | map(attribute='poolIndex')
             | zip(((__rustfs_peer_after['json']['details']['storage']['unavailableDrives'] | default([]))
                    + (__rustfs_peer_after['json']['details']['storage']['missingDrives'] | default([])))
                   | map(attribute='setIndex'),
                   ((__rustfs_peer_after['json']['details']['storage']['unavailableDrives'] | default([]))
                    + (__rustfs_peer_after['json']['details']['storage']['missingDrives'] | default([])))
                   | map(attribute='diskIndex'))
             | map('join', '/') | list) is subset(__rustfs_peer_baseline[item['name']])
      retries: "{{ rustfs_ready_retries }}"
      delay: "{{ rustfs_ready_delay }}"
      delegate_to: "{{ __rustfs_node }}"
      check_mode: false
      changed_when: false
      tags: service
  rescue:
    - name: Fail because a peer did not re-admit {{ __rustfs_node }}
      vars:
        __rustfs_peers_lagging: >-
          {{ ansible_failed_result['results'] | default([]) | selectattr('failed', 'defined')
             | selectattr('failed') | map(attribute='item') | map(attribute='name') | list }}
      ansible.builtin.fail:
        msg: >-
          {{ __rustfs_node }} restarted and is ready, but its peers did not
          re-admit it within {{ rustfs_ready_retries }} x {{ rustfs_ready_delay }} s:
          {{ __rustfs_peers_lagging }} still report it unavailable (drive baseline before the restart:
          {{ __rustfs_peer_baseline }}). The rollout stopped here; the nodes
          after {{ __rustfs_node }} were not restarted. Check the network
          between the nodes, then re-run the play to resume.
      delegate_to: "{{ __rustfs_node }}"
      tags: service
