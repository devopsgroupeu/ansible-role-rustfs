---
# ==============================================================================
# Rolling restart of one node (spec 8.3), included by service.yml with
# run_once and a loop, so nodes restart strictly one after another. Input:
#   __rustfs_node  inventory name of the node to restart
# The task context is the run_once host: every task delegates to the node and
# reads per-node values (peer URLs, main PID, probe CA, retries) through
# hostvars. Every failure message names the node.
# Peers (distributed only; a standalone node has none) are probed from the
# restarting node. /health/ready only says a peer can serve reads now, not
# that the cluster survives losing this node too, and RustFS has no
# maintenance probe. So the node goes down only when every peer is ready and
# lists no unavailable or missing drive (details.storage), and no other
# cluster host has a drive that RustFS is still healing (healing.bin): with
# a drive already offline or not rebuilt yet, taking a node down can cost an
# erasure set its read or write quorum. After the restart every peer must
# list no drive again (re-admission) before the next node goes down.
# Drive keys in messages are "<poolIndex>/<setIndex>/<diskIndex>".
# ==============================================================================

- name: Probe the peers before restarting {{ __rustfs_node }}
  ansible.builtin.uri:
    url: "{{ item['url'] }}/health/ready"
    method: GET
    status_code: [200, 503]
    validate_certs: true
    ca_path: "{{ hostvars[__rustfs_node]['__rustfs_probe_ca'] | default(omit, true) }}"
    use_proxy: false
  loop: "{{ hostvars[__rustfs_node]['__rustfs_peer_urls'] }}"
  loop_control:
    label: "{{ item['name'] }}"
  register: __rustfs_peer_before
  failed_when: false
  when: not ansible_check_mode
  delegate_to: "{{ __rustfs_node }}"
  check_mode: false
  changed_when: false
  tags: service

# A peer that is down refuses the restart of this node and of every node
# after it at once, so a bad change or a dead peer stops at one node at
# most. A ready peer without details.storage fails closed: the drives could
# not be checked.
- name: Validate every peer is ready before restarting {{ __rustfs_node }}
  vars:
    __rustfs_peers_not_ready: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in __rustfs_peer_before['results'] | default([]) if r['item'] is defined -%}
      {%-   set details = (r['json'] | default({}))['details'] | default({}) -%}
      {%-   if r['status'] | default(-1) != 200 or not (r['json']['ready'] | default(false)) -%}
      {%-     set why = (r['json']['degradedReasons'] | default([]) | join(','))
                        if r['json'] is defined else (r['msg'] | default('') | truncate(120)) -%}
      {%-     set ns.out = ns.out + ['peer ' ~ r['item']['name'] ~ ' is not ready (status '
                                     ~ (r['status'] | default('none')) ~ (': ' ~ why if why else '') ~ ')'] -%}
      {%-   elif details['storage'] is not defined
             or details['storage']['unavailableDrives'] is not defined
             or details['storage']['missingDrives'] is not defined -%}
      {%-     set ns.out = ns.out + ['peer ' ~ r['item']['name'] ~ ' is not ready (no details.storage drive lists in its /health/ready answer)'] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.out }}
  ansible.builtin.assert:
    that:
      - __rustfs_peers_not_ready | length == 0
    fail_msg: >-
      refusing to restart {{ __rustfs_node }}: {{ __rustfs_peers_not_ready | join('; ') }}.
      Nothing was restarted on {{ __rustfs_node }} or after it. Fix the peer,
      or set rustfs_rolling_restart: false to restart all changed nodes
      together in a maintenance window.
    quiet: true
  when: not ansible_check_mode
  delegate_to: "{{ __rustfs_node }}"
  tags: service

# Waits, because a peer can still list the drives of a node that started or
# restarted moments ago; a drive that stays offline refuses the restart.
- name: Block until every drive is online before restarting {{ __rustfs_node }}
  when: not ansible_check_mode
  tags: service
  block:
    - name: Wait until every peer reports every drive online before restarting {{ __rustfs_node }}
      ansible.builtin.uri:
        url: "{{ item['url'] }}/health/ready"
        method: GET
        status_code: [200, 503]
        validate_certs: true
        ca_path: "{{ hostvars[__rustfs_node]['__rustfs_probe_ca'] | default(omit, true) }}"
        use_proxy: false
      loop: "{{ hostvars[__rustfs_node]['__rustfs_peer_urls'] }}"
      loop_control:
        label: "{{ item['name'] }}"
      register: __rustfs_peer_drives
      until: >-
        __rustfs_peer_drives['status'] == 200
        and (__rustfs_peer_drives['json']['ready'] | default(false))
        and (__rustfs_peer_drives['json']['details']['storage']['unavailableDrives'] | default(['?'])) | length == 0
        and (__rustfs_peer_drives['json']['details']['storage']['missingDrives'] | default(['?'])) | length == 0
      retries: "{{ hostvars[__rustfs_node]['__rustfs_probe_retries'] }}"
      delay: "{{ hostvars[__rustfs_node]['__rustfs_probe_delay'] }}"
      delegate_to: "{{ __rustfs_node }}"
      check_mode: false
      changed_when: false
      tags: service
  rescue:
    - name: Fail because a drive is offline before restarting {{ __rustfs_node }}
      vars:
        __rustfs_peers_offline: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for r in ansible_failed_result['results'] | default([]) if r['failed'] | default(false) -%}
          {%-   set storage = ((r['json'] | default({}))['details'] | default({}))['storage'] | default({}) -%}
          {%-   set drives = (storage['unavailableDrives'] | default([])) + (storage['missingDrives'] | default([])) -%}
          {%-   set ns.out = ns.out + [r['item']['name'] ~ ' (status ' ~ (r['status'] | default('none')) ~ '): '
                                       ~ (drives | map(attribute='poolIndex') | zip(drives | map(attribute='setIndex'),
                                                                                       drives | map(attribute='diskIndex'))
                                          | map('join', '/') | join(', ') or 'not ready')] -%}
          {%- endfor -%}
          {{ ns.out | join('; ') }}
      ansible.builtin.fail:
        msg: >-
          refusing to restart {{ __rustfs_node }}: its peers still list drives as
          unavailable or missing after
          {{ hostvars[__rustfs_node]['__rustfs_probe_retries'] }} x {{ hostvars[__rustfs_node]['__rustfs_probe_delay'] }} s
          ({{ __rustfs_peers_offline }}). With a drive offline, taking another
          node down can cost an erasure set its read or write quorum. Nothing
          was restarted on {{ __rustfs_node }} or after it. Bring the drive
          back or replace it (TROUBLESHOOTING, "A drive is offline"), or set
          rustfs_rolling_restart: false to restart all changed nodes together
          in a maintenance window.
      delegate_to: "{{ __rustfs_node }}"
      tags: service

# A replaced drive leaves the drive lists as soon as RustFS has formatted
# it, but the erasure-set heal that rebuilds its shards can take hours, and
# /health/ready does not report it. Until the heal ends, every object it has
# not rebuilt yet lacks that shard, so taking this node down as well can cost
# those objects their read quorum. RustFS keeps
# <drive>/.rustfs.sys/healing.bin while the heal rebuilds a drive. The marker
# is looked for at every drive root of rustfs_volumes on every other cluster
# host (__rustfs_heal_markers), hosts outside --limit included; this node's
# own drives go down together with it and are not checked. A marker that
# stays for the whole wait fails its item, an unreachable host has no
# result: both are ignored here and refused by the next task.
- name: Wait until no drive of another cluster host heals before restarting {{ __rustfs_node }}
  ansible.builtin.stat:
    path: "{{ item['path'] }}"
    get_checksum: false
  loop: "{{ hostvars[__rustfs_node]['__rustfs_heal_markers'] }}"
  loop_control:
    label: "{{ item['host'] }}:{{ item['path'] }}"
  register: __rustfs_heal_marker
  until: "'stat' not in __rustfs_heal_marker or not __rustfs_heal_marker['stat']['exists']"
  retries: "{{ hostvars[__rustfs_node]['__rustfs_probe_retries'] }}"
  delay: "{{ hostvars[__rustfs_node]['__rustfs_probe_delay'] }}"
  failed_when: false
  ignore_errors: true
  ignore_unreachable: true
  when: not ansible_check_mode
  delegate_to: "{{ item['host'] }}"
  tags: service

- name: Validate no drive of another cluster host heals before restarting {{ __rustfs_node }}
  vars:
    __rustfs_peers_healing: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in __rustfs_heal_marker['results'] | default([]) if r['item'] is defined -%}
      {%-   if r['stat'] is not defined -%}
      {%-     set ns.out = ns.out + [r['item']['host'] ~ ' could not be checked ('
                                     ~ (r['msg'] | default('no result') | truncate(120)) ~ ')'] -%}
      {%-   elif r['stat']['exists'] -%}
      {%-     set ns.out = ns.out + [r['item']['host'] ~ ' still has ' ~ r['item']['path']] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.out }}
  ansible.builtin.assert:
    that:
      - __rustfs_peers_healing | length == 0
    fail_msg: >-
      refusing to restart {{ __rustfs_node }}: a drive of another cluster host
      is still healing or could not be checked after
      {{ hostvars[__rustfs_node]['__rustfs_probe_retries'] }} x {{ hostvars[__rustfs_node]['__rustfs_probe_delay'] }} s
      ({{ __rustfs_peers_healing | join('; ') }}). RustFS rebuilds a replaced
      drive after it stops listing it, and objects not rebuilt yet lack that
      shard: taking another node down can cost them their read quorum.
      Nothing was restarted on {{ __rustfs_node }} or after it. Wait until the
      heal ends (TROUBLESHOOTING, "A drive is offline"), or set
      rustfs_rolling_restart: false to restart all changed nodes together in
      a maintenance window.
    quiet: true
  when: not ansible_check_mode
  delegate_to: "{{ __rustfs_node }}"
  tags: service

# The symlink of a node waiting for its rolling restart was left on the old
# binary (service.yml); switch it right before this restart.
- name: Point the rustfs symlink at the versioned binary on {{ __rustfs_node }}
  ansible.builtin.file:
    src: "{{ hostvars[__rustfs_node]['__rustfs_versioned_bin_path'] }}"
    dest: "{{ hostvars[__rustfs_node]['__rustfs_bin_path'] }}"
    state: link
    force: true
  delegate_to: "{{ __rustfs_node }}"
  tags: service

- name: Restart RustFS on {{ __rustfs_node }}
  ansible.builtin.systemd_service:
    name: rustfs
    state: restarted
    daemon_reload: true
    no_block: true
  delegate_to: "{{ __rustfs_node }}"
  tags: service

- name: Wait for the restarted node {{ __rustfs_node }}
  ansible.builtin.include_tasks: wait_ready.yml
  vars:
    __rustfs_wait_node: "{{ __rustfs_node }}"
    __rustfs_wait_old_pid: "{{ hostvars[__rustfs_node]['__rustfs_main_pid'] }}"
  tags: service

# A node's own /health/ready says it can reach the cluster, not that the
# cluster reaches it again: wait until no peer lists an unavailable or
# missing drive.
- name: Block until every peer re-admits {{ __rustfs_node }}
  when: not ansible_check_mode
  tags: service
  block:
    - name: Wait until every peer re-admits the drives of {{ __rustfs_node }}
      ansible.builtin.uri:
        url: "{{ item['url'] }}/health/ready"
        method: GET
        status_code: [200, 503]
        validate_certs: true
        ca_path: "{{ hostvars[__rustfs_node]['__rustfs_probe_ca'] | default(omit, true) }}"
        use_proxy: false
      loop: "{{ hostvars[__rustfs_node]['__rustfs_peer_urls'] }}"
      loop_control:
        label: "{{ item['name'] }}"
      register: __rustfs_peer_after
      until: >-
        __rustfs_peer_after['status'] == 200
        and (__rustfs_peer_after['json']['ready'] | default(false))
        and (__rustfs_peer_after['json']['details']['storage']['unavailableDrives'] | default(['?'])) | length == 0
        and (__rustfs_peer_after['json']['details']['storage']['missingDrives'] | default(['?'])) | length == 0
      retries: "{{ hostvars[__rustfs_node]['__rustfs_probe_retries'] }}"
      delay: "{{ hostvars[__rustfs_node]['__rustfs_probe_delay'] }}"
      delegate_to: "{{ __rustfs_node }}"
      check_mode: false
      changed_when: false
      tags: service
  rescue:
    - name: Fail because a peer did not re-admit {{ __rustfs_node }}
      vars:
        __rustfs_peers_lagging: >-
          {{ ansible_failed_result['results'] | default([]) | selectattr('failed', 'defined')
             | selectattr('failed') | map(attribute='item') | map(attribute='name') | list }}
      ansible.builtin.fail:
        msg: >-
          {{ __rustfs_node }} restarted and is ready, but its peers did not
          re-admit it within {{ hostvars[__rustfs_node]['__rustfs_probe_retries'] }} x
          {{ hostvars[__rustfs_node]['__rustfs_probe_delay'] }} s:
          {{ __rustfs_peers_lagging }} still list a drive as unavailable or
          missing. The rollout stopped here; the nodes after
          {{ __rustfs_node }} were not restarted. Check the network between
          the nodes, then re-run the play to resume.
      delegate_to: "{{ __rustfs_node }}"
      tags: service
