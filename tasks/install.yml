---
# ==============================================================================
# Install: service user, package dependencies, then the release zip as a
# versioned binary. Preflight P6 has already refused an unmanaged binary at
# the symlink path and a downgrade.
# A version is installed once: a versioned binary whose SHA-256 matches the
# digest file written when the role installed it is kept, and nothing is
# downloaded. Any other versioned binary (missing, changed, or placed by
# hand without the digest file) is downloaded and verified again. Upstream
# publishes no signature, so the SHA-256 of the zip (__rustfs_checksum_arg)
# is the integrity control, and the extracted binary must report the
# expected version, run as the service user, before it is installed.
# The rustfs symlink is not switched here: service.yml switches it per node
# right before that node starts or restarts, so an aborted rollout leaves
# the nodes it did not reach on their old binary, also for a crash restart.
# ==============================================================================

- name: Create the rustfs system group
  ansible.builtin.group:
    name: "{{ rustfs_group }}"
    system: true
    state: present
  tags: install

# No login shell; the home is created by config.yml with its owner and mode.
- name: Create the rustfs system user
  ansible.builtin.user:
    name: "{{ rustfs_user }}"
    group: "{{ rustfs_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ rustfs_home }}"
    create_home: false
    state: present
  tags: install

# On every run, not only with a download: community.crypto (the TLS stage)
# needs python3-cryptography on every host.
- name: Install package dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ __rustfs_pkg_deps['Debian'] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  tags: install

- name: Install package dependencies (RHEL/EL)
  ansible.builtin.dnf:
    name: "{{ __rustfs_pkg_deps['RedHat'] }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: install

- name: Stat the versioned binary with its SHA-256
  ansible.builtin.stat:
    path: "{{ __rustfs_versioned_bin }}"
    checksum_algorithm: sha256
  register: __rustfs_versioned_stat
  tags: install

- name: Read the digest of the installed versioned binary
  ansible.builtin.slurp:
    src: "{{ __rustfs_versioned_digest_file }}"
  register: __rustfs_versioned_digest
  failed_when: false
  when: __rustfs_versioned_stat['stat']['exists']
  tags: install

# tempfile has no check mode, so a check run skips the download; service.yml
# then reports the pending version change.
- name: Download, verify and install the versioned binary
  when:
    - >-
      not __rustfs_versioned_stat['stat']['exists']
      or (__rustfs_versioned_digest['content'] | default('') | b64decode | trim)
         != __rustfs_versioned_stat['stat']['checksum']
    - not ansible_check_mode
  tags: install
  block:
    # Inside rustfs_bin_dir, not /tmp: /tmp may be noexec (the version check
    # runs the extracted binary) or a small tmpfs (the gnu build needs about
    # 500 MB), while rustfs_bin_dir must allow execution anyway.
    - name: Create a temporary download directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ rustfs_bin_dir }}"
        prefix: ".rustfs-install-"
      register: __rustfs_install_tmp

    # tmp_dest keeps get_url's staging copy in the same directory.
    - name: Download the release zip with its SHA-256
      ansible.builtin.get_url:
        url: "{{ __rustfs_download_url }}"
        dest: "{{ __rustfs_install_tmp['path'] }}/{{ __rustfs_asset }}"
        tmp_dest: "{{ __rustfs_install_tmp['path'] }}"
        checksum: "{{ __rustfs_checksum_arg }}"
        timeout: 300
        mode: "0600"

    # The gnu zip also holds profiling artefacts the server never loads.
    - name: Extract the rustfs binary
      ansible.builtin.unarchive:
        src: "{{ __rustfs_install_tmp['path'] }}/{{ __rustfs_asset }}"
        dest: "{{ __rustfs_install_tmp['path'] }}"
        remote_src: true
        include:
          - rustfs

    # The version check runs the binary before anything else trusts it, so
    # it runs as the unprivileged service user, not as root: the directory
    # must let that user reach the binary (the zip itself stays 0600).
    - name: Open the temporary download directory to the service user
      ansible.builtin.file:
        path: "{{ __rustfs_install_tmp['path'] }}"
        state: directory
        mode: "0755"

    - name: Read the version of the extracted binary
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - "{{ rustfs_user }}"
          - --
          - "{{ __rustfs_install_tmp['path'] }}/rustfs"
          - --version
        chdir: "{{ __rustfs_install_tmp['path'] }}"
      register: __rustfs_install_version
      changed_when: false

    # Whole-line version tokens, compared exactly: a commit with several tags
    # prints one per line ("rustfs 1.0.6", "1.0.6-preview.2", "git tag :
    # ..."), and a substring test would accept 1.0.10 for 1.0.1.
    - name: Validate the extracted binary reports rustfs_version
      vars:
        __rustfs_install_tokens: >-
          {{ __rustfs_install_version['stdout']
             | regex_findall('(?m)^(?:rustfs |git tag *: )?([0-9]+[.][0-9]+[.][0-9]+(?:-[0-9A-Za-z.]+)?)$')
             | unique }}
      ansible.builtin.assert:
        that:
          - rustfs_version in __rustfs_install_tokens
        fail_msg: >-
          The binary in {{ __rustfs_asset }} reports the versions
          {{ __rustfs_install_tokens }} ({{ __rustfs_install_version['stdout_lines'] | first | default('') }}),
          not rustfs_version {{ rustfs_version }}. Nothing was installed.
          Check rustfs_download_base_url and rustfs_checksum: the mirror may
          serve a different release under this name.
        quiet: true

    - name: Stat the verified binary with its SHA-256
      ansible.builtin.stat:
        path: "{{ __rustfs_install_tmp['path'] }}/rustfs"
        checksum_algorithm: sha256
      register: __rustfs_install_stat

    # copy writes a temporary file next to the destination and renames it,
    # so an existing versioned binary is always complete. A running process
    # keeps the inode it was started from.
    - name: Install the versioned binary
      ansible.builtin.copy:
        src: "{{ __rustfs_install_tmp['path'] }}/rustfs"
        dest: "{{ __rustfs_versioned_bin }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    # Written last: only a complete, verified install has its digest file.
    - name: Record the digest of the versioned binary
      ansible.builtin.copy:
        content: "{{ __rustfs_install_stat['stat']['checksum'] }}\n"
        dest: "{{ __rustfs_versioned_digest_file }}"
        owner: root
        group: root
        mode: "0644"

  always:
    - name: Remove the temporary download directory
      ansible.builtin.file:
        path: "{{ __rustfs_install_tmp['path'] }}"
        state: absent
      when: __rustfs_install_tmp['path'] is defined
