---
# Verify the upgrade scenario after side_effect.yml: the node runs the
# previous gnu build again (rollback), both versioned binaries are kept side
# by side, and the object written before the upgrade survived the upgrade
# and the rollback.

- name: Verify upgrade and rollback
  hosts: all
  become: true
  gather_facts: true
  vars:
    __verify_url: "http://localhost:9000"
    __verify_role_dir: "{{ playbook_dir }}/../.."
    __verify_previous_bin: "/usr/local/bin/rustfs-{{ __molecule_previous_version }}-gnu"
  tasks:
    # Read from the role's files, so a version bump needs no change here.
    - name: Read the default version of the role
      ansible.builtin.set_fact:
        __verify_default_version: "{{ (lookup('ansible.builtin.file', __verify_role_dir ~ '/defaults/main.yml') | from_yaml)['rustfs_version'] }}"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Read the running process
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Stat the rustfs symlink
      ansible.builtin.stat:
        path: /usr/local/bin/rustfs
        follow: false
        get_checksum: false
      register: __verify_link

    - name: Stat both versioned binaries
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "{{ __verify_previous_bin }}"
        - "/usr/local/bin/rustfs-{{ __verify_default_version }}-musl"
      loop_control:
        label: "{{ item }}"
      register: __verify_bins

    - name: Probe /health/ready
      ansible.builtin.uri:
        url: "{{ __verify_url }}/health/ready"
      register: __verify_ready

    # The SigV4 helper of molecule/shared/files (the curl 7.76.1 of EL 9 signs
    # requests RustFS rejects). The credentials go in on stdin, never in argv.
    - name: Copy the S3 SigV4 helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../shared/files/s3_sigv4.py"
        dest: /root/molecule-s3-sigv4.py
        owner: root
        group: root
        mode: "0644"

    - name: Download the object written before the upgrade
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /root/molecule-s3-sigv4.py
          - GET
          - "{{ __verify_url }}/molecule-bucket/object.txt"
        stdin: "{{ {'access_key': rustfs_access_key, 'secret_key': rustfs_secret_key} | to_json }}"
      register: __verify_get
      changed_when: false
      no_log: true

    - name: Assert the rollback state
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['rustfs.service']['state'] == 'running'
          - ansible_facts['services']['rustfs.service']['status'] == 'enabled'
          - __verify_proc_exe == __verify_previous_bin
          - __verify_link['stat']['islnk'] and __verify_link['stat']['lnk_target'] == __verify_previous_bin
          - __verify_ready['json']['ready'] is true
          - __verify_ready['json']['version'] == __molecule_previous_version
          - __verify_get['stdout'] == 'molecule-upgrade-payload'
        fail_msg: >-
          rollback state is wrong: unit {{ ansible_facts['services']['rustfs.service'] | default('missing') }},
          exe {{ __verify_proc_exe }}, link {{ __verify_link['stat']['lnk_target'] | default('missing') }},
          ready {{ __verify_ready['json'] | default(__verify_ready['status']) }},
          object {{ __verify_get['stdout'] | default('') | length }} bytes

    - name: Assert both versioned binaries are installed
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isreg']
          - item['stat']['pw_name'] == 'root'
          - item['stat']['mode'] == '0755'
        fail_msg: >-
          {{ item['item'] }} is {{ item['stat']['pw_name'] | default('missing') }}
          {{ item['stat']['mode'] | default('') }}, expected a root-owned 0755 file
        quiet: true
      loop: "{{ __verify_bins['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"
