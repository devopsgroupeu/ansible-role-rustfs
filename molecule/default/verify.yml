---
# Verify the default scenario (real install, generated TLS, running service).
# Play 1 checks the installed binary, the service user, the generated TLS
# material, the rendered files and the owners and modes of spec 7.1. It
# gathers facts, which the later plays reuse. Play 2 checks the running
# service: health endpoints over HTTPS against the generated CA, the process
# user, binary and environment, and an S3 round trip with the
# special-character secret. The behaviour plays then re-run the role: an
# interrupted rollout restarts exactly once (under a proxy environment the
# probes ignore), the stage tags of a static role converge, an unmounted
# drive is refused by the role but not by the unit, a second one stops the
# node (distinct-disk check), and new drives are taken in, two guards refuse
# and leave the host untouched (main PID, symlink target, env file), a
# rejected certificate reload restarts the node and an accepted one does
# not, the probes keep ca.crt with the OS store trusted too and use the OS
# store when ca.crt does not sign the node certificate, a certificate no
# trusted CA signs is refused before the restart, BYO mode accepts the
# material in place, a symlinked rustfs_bin_dir
# restarts once and a binary without its digest is installed again, the
# service can be stopped and disabled and brought back, and an IAM master
# key change must keep the old key.

- name: Verify install
  hosts: all
  become: true
  gather_facts: true
  vars:
    # The secret of molecule.yml as Ansible must receive it.
    __verify_secret_key: 'molecule-secret $#''key-0123456789'
  tasks:
    - name: Stat the rustfs symlink
      ansible.builtin.stat:
        path: /usr/local/bin/rustfs
        follow: false
        get_checksum: false
      register: __verify_link

    - name: Stat the versioned binary
      ansible.builtin.stat:
        path: /usr/local/bin/rustfs-1.0.6-musl
        get_checksum: false
      register: __verify_bin

    - name: Run rustfs --version through the symlink
      ansible.builtin.command: /usr/local/bin/rustfs --version
      register: __verify_version
      changed_when: false

    - name: Read the service user
      ansible.builtin.getent:
        database: passwd
        key: rustfs
      register: __verify_user

    - name: Find leftover temporary download directories
      ansible.builtin.find:
        paths: /usr/local/bin
        patterns: ".rustfs-install-*"
        file_type: any
        hidden: true
      register: __verify_leftovers

    - name: Read the generated node certificate
      community.crypto.x509_certificate_info:
        path: /etc/rustfs/tls/rustfs_cert.pem
        valid_at:
          in_395d: "+395d"
          in_405d: "+405d"
      register: __verify_cert

    - name: Stat the generated CA key
      ansible.builtin.stat:
        path: /etc/rustfs/tls/ca.key
        get_checksum: false
      register: __verify_ca_key

    - name: Stat the versioned binary with its SHA-256
      ansible.builtin.stat:
        path: /usr/local/bin/rustfs-1.0.6-musl
        checksum_algorithm: sha256
      register: __verify_bin_digest

    - name: Read the digest file of the versioned binary
      ansible.builtin.slurp:
        src: /usr/local/bin/rustfs-1.0.6-musl.sha256
      register: __verify_digest_file

    - name: Assert the install and the generated TLS material
      ansible.builtin.assert:
        that:
          - __verify_link['stat']['islnk'] and __verify_link['stat']['lnk_target'] == '/usr/local/bin/rustfs-1.0.6-musl'
          - __verify_link['stat']['pw_name'] == 'root'
          - __verify_bin['stat']['isreg']
          - __verify_bin['stat']['mode'] == '0755' and __verify_bin['stat']['pw_name'] == 'root'
          - "'1.0.6' in (__verify_version['stdout'] | regex_findall('(?m)^(?:rustfs |git tag\\s*: )?(\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.]+)?)$'))"
          - __verify_user['ansible_facts']['getent_passwd']['rustfs'][4] == '/opt/rustfs'
          - __verify_user['ansible_facts']['getent_passwd']['rustfs'][5] == '/usr/sbin/nologin'
          - __verify_leftovers['files'] | length == 0
          - "'DNS:localhost' in __verify_cert['subject_alt_name']"
          - "'IP:127.0.0.1' in __verify_cert['subject_alt_name']"
          - "'DNS:rustfs-default' in __verify_cert['subject_alt_name']"
          - "'DNS:rustfs.molecule.test' in __verify_cert['subject_alt_name']"
          - __verify_cert['subject_alt_name'] | length == __verify_cert['subject_alt_name'] | unique | length
          - "'TLS Web Server Authentication' in __verify_cert['extended_key_usage']"
          - "'TLS Web Client Authentication' in __verify_cert['extended_key_usage']"
          - __verify_cert['valid_at']['in_395d']
          - not __verify_cert['valid_at']['in_405d']
          - __verify_ca_key['stat']['mode'] == '0600'
          - (__verify_digest_file['content'] | b64decode | trim) == __verify_bin_digest['stat']['checksum']
        fail_msg: >-
          install or TLS check failed: link {{ __verify_link['stat']['lnk_target'] | default('missing') }},
          version output {{ __verify_version['stdout_lines'] }},
          leftovers {{ __verify_leftovers['files'] | map(attribute='path') | list }},
          SANs {{ __verify_cert['subject_alt_name'] }},
          EKU {{ __verify_cert['extended_key_usage'] | default([]) }},
          not after {{ __verify_cert['not_after'] }}

    - name: Read the rendered files
      ansible.builtin.include_tasks: ../shared/tasks/read_rendered.yml

    # The binary exists here, so systemd-analyze must pass without any
    # warning (render can only check for ignored directives).
    - name: Assert systemd-analyze verify passes
      ansible.builtin.assert:
        that:
          - __verify_analyze['rc'] == 0
        fail_msg: "systemd-analyze verify: {{ __verify_analyze['stderr'] }}"

    - name: Assert the unit and the env file
      ansible.builtin.assert:
        that:
          - "'RUSTFS_VOLUMES=\"/data/rustfs{0...3}\"' in __verify_env"
          - "'RUSTFS_TLS_PATH=\"/etc/rustfs/tls\"' in __verify_env"
          # The distinct-disk check of RustFS stays on.
          - "'RUSTFS_UNSAFE_BYPASS_DISK_CHECK' not in __verify_env"
          - "'RUSTFS_UNSUPPORTED_FS_POLICY=\"warn\"' in __verify_env"
          - "'ExecStart=/usr/local/bin/rustfs server' in __verify_unit"
          - "'ReadWritePaths=/opt/rustfs /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3 /var/lib/rustfs-extra' in __verify_unit"
          # Ordered after the tmpfs mounts, never bound to them.
          - "'After=data-rustfs0.mount data-rustfs1.mount data-rustfs2.mount data-rustfs3.mount' in __verify_unit.splitlines()"
          - "'RequiresMountsFor' not in __verify_unit"
          - "'AssertPathIsMountPoint' not in __verify_unit"
          - "'DefaultDependencies=no' in __verify_unit.splitlines()"
        fail_msg: "the unit or the env file is wrong"

    # The secret must reach secrets.env byte for byte and nothing else.
    - name: Assert the secrets stay in secrets.env
      ansible.builtin.assert:
        that:
          - rustfs_secret_key == __verify_secret_key
          - ('RUSTFS_SECRET_KEY="' ~ __verify_secret_key ~ '"') in __verify_secrets.splitlines()
          - "'RUSTFS_ACCESS_KEY=\"MOLECULEADMIN\"' in __verify_secrets.splitlines()"
          - "'RUSTFS_IAM_MASTER_KEY=\"molecule-iam-master-key-0123456789\"' in __verify_secrets.splitlines()"
          - __verify_secret_key not in __verify_env
          - "'MOLECULEADMIN' not in __verify_env"
          - "'molecule-iam-master-key-0123456789' not in __verify_env"
          - __verify_secret_key not in __verify_unit
      no_log: true

    - name: Stat the paths of spec 7.1
      ansible.builtin.stat:
        path: "{{ item['path'] }}"
        get_checksum: false
      loop:
        - {path: /usr/local/bin/rustfs-1.0.6-musl, dir: false, owner: root, group: root, mode: "0755"}
        - {path: /usr/local/bin/rustfs-1.0.6-musl.sha256, dir: false, owner: root, group: root, mode: "0644"}
        - {path: /opt/rustfs, dir: true, owner: rustfs, group: rustfs, mode: "0750"}
        - {path: /etc/rustfs, dir: true, owner: root, group: rustfs, mode: "0750"}
        - {path: /etc/rustfs/tls, dir: true, owner: root, group: rustfs, mode: "0750"}
        - {path: /data/rustfs0, dir: true, owner: rustfs, group: rustfs, mode: "0750"}
        - {path: /data/rustfs1, dir: true, owner: rustfs, group: rustfs, mode: "0750"}
        - {path: /data/rustfs2, dir: true, owner: rustfs, group: rustfs, mode: "0750"}
        - {path: /data/rustfs3, dir: true, owner: rustfs, group: rustfs, mode: "0750"}
        - {path: /etc/default/rustfs, dir: false, owner: root, group: rustfs, mode: "0640"}
        - {path: /etc/rustfs/secrets.env, dir: false, owner: root, group: root, mode: "0600"}
        - {path: /etc/systemd/system/rustfs.service, dir: false, owner: root, group: root, mode: "0644"}
        - {path: /etc/rustfs/tls/rustfs_key.pem, dir: false, owner: root, group: rustfs, mode: "0640"}
        - {path: /etc/rustfs/tls/rustfs_cert.pem, dir: false, owner: root, group: root, mode: "0644"}
        - {path: /etc/rustfs/tls/ca.crt, dir: false, owner: root, group: root, mode: "0644"}
        - {path: /etc/rustfs/tls/ca.key, dir: false, owner: root, group: root, mode: "0600"}
      loop_control:
        label: "{{ item['path'] }}"
      register: __verify_paths

    - name: Assert owners and modes of spec 7.1
      ansible.builtin.assert:
        that:
          - item['stat']['exists']
          - item['stat']['isdir'] == item['item']['dir']
          - item['stat']['pw_name'] == item['item']['owner']
          - item['stat']['gr_name'] == item['item']['group']
          - item['stat']['mode'] == item['item']['mode']
        fail_msg: >-
          {{ item['item']['path'] }} is
          {{ item['stat']['pw_name'] | default('missing') }}:{{ item['stat']['gr_name'] | default('') }}
          {{ item['stat']['mode'] | default('') }}, expected
          {{ item['item']['owner'] }}:{{ item['item']['group'] }} {{ item['item']['mode'] }}
        quiet: true
      loop: "{{ __verify_paths['results'] }}"
      loop_control:
        label: "{{ item['item']['path'] }}"

- name: Verify service
  hosts: all
  become: true
  gather_facts: false
  vars:
    # node address of a wildcard listener; the generated certificate has a
    # SAN for it
    __verify_url: "https://localhost:9000"
    __verify_console_url: "https://localhost:9001"
    __verify_ca: /etc/rustfs/tls/ca.crt
    # The secret of molecule.yml as Ansible must receive it.
    __verify_secret_key: 'molecule-secret $#''key-0123456789'
    # argv of every signed S3 request: the SigV4 helper of
    # molecule/shared/files (the curl 7.76.1 of EL 9 signs requests RustFS
    # rejects). The credentials go in on stdin, never in argv.
    __verify_s3_cmd:
      - /usr/bin/python3
      - /root/molecule-s3-sigv4.py
      - --cacert
      - "{{ __verify_ca }}"
    __verify_s3_credentials: "{{ {'access_key': rustfs_access_key, 'secret_key': rustfs_secret_key} | to_json }}"
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Read the running process
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Read the user of the main process
      ansible.builtin.command:
        argv:
          - ps
          - -o
          - user=
          - -p
          - "{{ __verify_proc_pid }}"
      register: __verify_ps
      changed_when: false

    # DefaultDependencies=no in the unit: boot does not wait for a node that
    # waits for quorum (a read-only property query).
    - name: Read the ordering of multi-user.target
      ansible.builtin.command: systemctl show multi-user.target --property=After --value # noqa: command-instead-of-module
      register: __verify_target_after
      changed_when: false

    - name: Assert multi-user.target does not wait for RustFS
      ansible.builtin.assert:
        that:
          - "'rustfs.service' not in __verify_target_after['stdout'].split()"
        fail_msg: "multi-user.target is ordered after: {{ __verify_target_after['stdout'] }}"

    - name: Probe /health/ready
      ansible.builtin.uri:
        url: "{{ __verify_url }}/health/ready"
        ca_path: "{{ __verify_ca }}"
      register: __verify_ready

    - name: Probe /health/live
      ansible.builtin.uri:
        url: "{{ __verify_url }}/health/live"
        ca_path: "{{ __verify_ca }}"
      register: __verify_live

    - name: Probe /minio/health/cluster
      ansible.builtin.uri:
        url: "{{ __verify_url }}/minio/health/cluster"
        ca_path: "{{ __verify_ca }}"
      register: __verify_cluster

    - name: Probe the console health endpoint
      ansible.builtin.uri:
        url: "{{ __verify_console_url }}/rustfs/console/health"
        ca_path: "{{ __verify_ca }}"
      register: __verify_console

    - name: Write the test object payload
      ansible.builtin.copy:
        content: "molecule-object-payload"
        dest: /root/molecule-object.txt
        owner: root
        group: root
        mode: "0600"

    - name: Copy the S3 SigV4 helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../shared/files/s3_sigv4.py"
        dest: /root/molecule-s3-sigv4.py
        owner: root
        group: root
        mode: "0644"

    # 409 when an earlier verify run created it already.
    - name: Create the test bucket over S3
      ansible.builtin.command:
        argv: "{{ __verify_s3_cmd + ['--status', 'PUT', __verify_url ~ '/molecule-bucket'] }}"
        stdin: "{{ __verify_s3_credentials }}"
      register: __verify_bucket
      changed_when: false
      no_log: true

    - name: Upload the test object over S3
      ansible.builtin.command:
        argv: >-
          {{ __verify_s3_cmd + ['--upload', '/root/molecule-object.txt',
                                'PUT', __verify_url ~ '/molecule-bucket/object.txt'] }}
        stdin: "{{ __verify_s3_credentials }}"
      changed_when: false
      no_log: true

    - name: Download the test object over S3
      ansible.builtin.command:
        argv: "{{ __verify_s3_cmd + ['GET', __verify_url ~ '/molecule-bucket/object.txt'] }}"
        stdin: "{{ __verify_s3_credentials }}"
      register: __verify_get
      changed_when: false
      no_log: true

    - name: Request the test object without a signature
      ansible.builtin.uri:
        url: "{{ __verify_url }}/molecule-bucket/object.txt"
        ca_path: "{{ __verify_ca }}"
        status_code: 403
      register: __verify_unsigned

    - name: Assert the service and the S3 round trip
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['rustfs.service']['state'] == 'running'
          - ansible_facts['services']['rustfs.service']['status'] == 'enabled'
          - __verify_proc_exe == '/usr/local/bin/rustfs-1.0.6-musl'
          - __verify_ps['stdout'] | trim == 'rustfs'
          - __verify_ready['status'] == 200 and __verify_ready['json']['ready'] is true
          - __verify_ready['json']['version'] == '1.0.6'
          - __verify_live['status'] == 200
          - __verify_cluster['status'] == 200
          - __verify_console['status'] == 200
          - __verify_bucket['stdout'] in ['200', '409']
          - __verify_get['stdout'] == 'molecule-object-payload'
          - __verify_unsigned['status'] == 403
        fail_msg: >-
          service check failed: unit {{ ansible_facts['services']['rustfs.service'] | default('missing') }},
          exe {{ __verify_proc_exe }}, user {{ __verify_ps['stdout'] }},
          ready {{ __verify_ready['json'] | default(__verify_ready['status']) }},
          bucket HTTP {{ __verify_bucket['stdout'] }}, unsigned HTTP {{ __verify_unsigned['status'] }}

    # Review Focus 2 and the IAM master key decision: the values reach the
    # process environment byte for byte (systemd transforms nothing).
    - name: Assert the secrets reach the process environment unchanged
      ansible.builtin.assert:
        that:
          - __verify_proc_env['RUSTFS_SECRET_KEY'] == __verify_secret_key
          - __verify_proc_env['RUSTFS_ACCESS_KEY'] == 'MOLECULEADMIN'
          - __verify_proc_env['RUSTFS_IAM_MASTER_KEY'] == 'molecule-iam-master-key-0123456789'
          - __verify_proc_env['RUSTFS_OBS_LOGGER_LEVEL'] == 'info'
          - __verify_proc_env['RUSTFS_VOLUMES'] == '/data/rustfs{0...3}'
      no_log: true

# ------------------------------------------------------------------------------
# Behaviour plays
# ------------------------------------------------------------------------------

# Review Focus 1 (spec 10.1 play 1): a --tags config style run (here
# rustfs_config_only) renders a change without touching the service; the
# next normal run must restart exactly once, in the rolling path, and the
# run after that must not restart again. The play runs with a proxy in the
# environment that refuses every connection: the health probes (readiness
# wait, write-quorum gate) must not use it.
- name: "Behaviour: interrupted rollout restarts once"
  hosts: all
  become: true
  gather_facts: false
  environment:
    http_proxy: "http://127.0.0.1:9"
    https_proxy: "http://127.0.0.1:9"
    HTTP_PROXY: "http://127.0.0.1:9"
    HTTPS_PROXY: "http://127.0.0.1:9"
    no_proxy: ""
  tasks:
    - name: Record the host state
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Keep the state before the run
      ansible.builtin.set_fact:
        __verify_state_before: "{{ __verify_state }}"

    - name: Render a changed log level without managing the service
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_config_only: true
        rustfs_log_level: "warn"

    - name: Record the host state after rendering
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Assert the render-only run touched no process
      ansible.builtin.assert:
        that:
          - __verify_state['main_pid'] | int == __verify_state_before['main_pid'] | int
          - __verify_state['main_pid'] | int > 0
          - __verify_state['env_checksum'] != __verify_state_before['env_checksum']
        fail_msg: "host state before {{ __verify_state_before }}, after rendering {{ __verify_state }}"

    - name: Keep the state after rendering
      ansible.builtin.set_fact:
        __verify_state_rendered: "{{ __verify_state }}"

    - name: Run the role with the same log level
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_log_level: "warn"

    - name: Read the running process after the run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the run restarted once in the rolling path with the new level
      ansible.builtin.assert:
        that:
          - __verify_proc_pid | int != __verify_state_rendered['main_pid'] | int
          - __rustfs_restart_needed
          - not __rustfs_restart_together
          - __rustfs_restart_reasons == ['RUSTFS_OBS_LOGGER_LEVEL']
          - __verify_proc_env['RUSTFS_OBS_LOGGER_LEVEL'] == 'warn'
        fail_msg: >-
          main PID {{ __verify_state_rendered['main_pid'] }} -> {{ __verify_proc_pid }},
          restart needed {{ __rustfs_restart_needed | default('unset') }},
          together {{ __rustfs_restart_together | default('unset') }},
          reasons {{ __rustfs_restart_reasons | default('unset') }}

    - name: Keep the main PID after the restart
      ansible.builtin.set_fact:
        __verify_pid_restarted: "{{ __verify_proc_pid }}"

    - name: Run the role a third time with the same log level
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_log_level: "warn"

    - name: Read the running process after the third run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the third run did not restart
      ansible.builtin.assert:
        that:
          - __verify_proc_pid | int == __verify_pid_restarted | int
          - not __rustfs_restart_needed
          - __rustfs_restart_reasons == []
        fail_msg: >-
          main PID {{ __verify_pid_restarted }} -> {{ __verify_proc_pid }},
          reasons {{ __rustfs_restart_reasons | default('unset') }}

# README "How restarts work": the stage tags select stages when the role is
# applied statically (static.yml, roles:). Each step is a separate
# ansible-playbook run on the controller against the molecule inventory.
# --tags service after a variable change refuses (the files on disk still
# hold the old value, so a restart would not converge); --tags
# config,service then renders and restarts once; --tags install changes
# nothing on an installed host.
- name: "Behaviour: stage tags, the state before"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Record the host state
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Keep the state before the tagged runs
      ansible.builtin.set_fact:
        __verify_state_tags: "{{ __verify_state }}"

- name: "Behaviour: stage tags, the tagged runs"
  hosts: localhost
  gather_facts: false
  vars:
    __verify_tags_cmd:
      - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
      - -i
      - "{{ lookup('ansible.builtin.env', 'MOLECULE_INVENTORY_FILE') }}"
      - "{{ playbook_dir }}/static.yml"
      # Back to the scenario level (the play above left "warn"), so the
      # later plays run without a pending change.
      - -e
      - rustfs_log_level=info
  tasks:
    - name: Run only the service stage after a variable change
      ansible.builtin.command:
        argv: "{{ __verify_tags_cmd + ['--tags', 'service'] }}"
      register: __verify_tags_service
      failed_when: false
      changed_when: false

    # ansible-core prints the error of a failed task to stderr.
    - name: Assert the service stage refused the stale files
      vars:
        __verify_tags_output: "{{ __verify_tags_service['stdout'] ~ __verify_tags_service['stderr'] }}"
      ansible.builtin.assert:
        that:
          - __verify_tags_service['rc'] == 2
          - "'do not match the role variables' in __verify_tags_output"
          - "'RUSTFS_OBS_LOGGER_LEVEL' in __verify_tags_output"
        fail_msg: "rc {{ __verify_tags_service['rc'] }}: {{ __verify_tags_service['stderr_lines'][-10:] }}"

    - name: Run the config and service stages
      ansible.builtin.command:
        argv: "{{ __verify_tags_cmd + ['--tags', 'config,service'] }}"
      register: __verify_tags_apply
      failed_when: false
      changed_when: true

    - name: Run only the install stage
      ansible.builtin.command:
        argv: "{{ __verify_tags_cmd + ['--tags', 'install'] }}"
      register: __verify_tags_install
      failed_when: false
      changed_when: false

    - name: Assert the tagged runs succeeded
      ansible.builtin.assert:
        that:
          - __verify_tags_apply['rc'] == 0
          - "'restarts in the rolling order' in __verify_tags_apply['stdout']"
          - __verify_tags_install['rc'] == 0
          - __verify_tags_install['stdout'] is search('changed=0 ')
        fail_msg: >-
          config,service rc {{ __verify_tags_apply['rc'] }}: {{ __verify_tags_apply['stdout_lines'][-25:] }};
          install rc {{ __verify_tags_install['rc'] }}: {{ __verify_tags_install['stdout_lines'][-10:] }}

- name: "Behaviour: stage tags, the state after"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the running process after the tagged runs
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the tagged runs restarted once onto the new level
      ansible.builtin.assert:
        that:
          - __verify_proc_pid | int != __verify_state_tags['main_pid'] | int
          - __verify_proc_env['RUSTFS_OBS_LOGGER_LEVEL'] == 'info'
        fail_msg: "main PID {{ __verify_state_tags['main_pid'] }} -> {{ __verify_proc_pid }}"
      no_log: true

# ------------------------------------------------------------------------------
# Drives and guards. The guard plays record the host state, run the role
# inside block / rescue with one guard tripped, check the refusal with
# molecule/shared/tasks/expect_failure.yml (the message names the variable
# or path and never the secret), then prove the state is unchanged. The
# guards are in preflight.yml, so they refuse before install, config or
# service.
# ------------------------------------------------------------------------------

# Spec 10.1 play 2. A drive that is not mounted (a failed mount at boot, a
# pulled disk): the role refuses to run, because it would set the owner of
# the directory below the mount, but the unit still starts and RustFS
# serves on the other drives without writing to that root-owned directory.
# A second unmounted drive is the limit of that: both directories sit on the
# root filesystem, and the distinct-disk check of RustFS refuses the start.
# New, empty drives at both paths are taken in the documented way (README,
# "Drives and reboots"): a restart by hand makes the new mounts visible to
# RustFS, the role run then sets the owner of the new filesystems, and
# RustFS formats and heals them by itself (four drives, parity 2).
- name: "Behaviour: an unmounted drive is one offline drive"
  hosts: all
  become: true
  gather_facts: false
  vars:
    __verify_url: "https://localhost:9000"
    __verify_ca: /etc/rustfs/tls/ca.crt
  tasks:
    - name: Stop RustFS
      ansible.builtin.systemd_service:
        name: rustfs
        state: stopped

    - name: Unmount the drive /data/rustfs3
      ansible.builtin.command: umount /data/rustfs3
      changed_when: true

    - name: Record the host state
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Keep the state before the run
      ansible.builtin.set_fact:
        __verify_state_before: "{{ __verify_state }}"

    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a data dir that is not a mount point"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "these data dirs are not mount points: ['/data/rustfs3']"
            __verify_secret: "{{ rustfs_secret_key }}"

    - name: Record the host state after the refusal
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Assert the refusal changed nothing
      ansible.builtin.assert:
        that:
          - __verify_state == __verify_state_before
          - __verify_state['link_target'] == '/usr/local/bin/rustfs-1.0.6-musl'
        fail_msg: "host state before {{ __verify_state_before }}, after {{ __verify_state }}"

    - name: Start the unit without the drive
      ansible.builtin.systemd_service:
        name: rustfs
        state: started
        no_block: true

    - name: Wait until the node is ready without the drive
      ansible.builtin.uri:
        url: "{{ __verify_url }}/health/ready"
        ca_path: "{{ __verify_ca }}"
        status_code: [200, 503]
      register: __verify_degraded
      until: __verify_degraded['status'] == 200
      retries: 30
      delay: 2
      failed_when: __verify_degraded['status'] != 200

    - name: Stat the directory below the mount
      ansible.builtin.stat:
        path: /data/rustfs3
        get_checksum: false
      register: __verify_bare_dir

    - name: Find files RustFS wrote below the mount
      ansible.builtin.find:
        paths: /data/rustfs3
        file_type: any
        hidden: true
        recurse: true
      register: __verify_bare_files

    - name: Assert RustFS serves on three drives and wrote nothing to the root disk
      vars:
        __verify_offline: >-
          {{ __verify_degraded['json']['details']['storage']['unavailableDrives']
             + __verify_degraded['json']['details']['storage']['missingDrives'] }}
      ansible.builtin.assert:
        that:
          - __verify_degraded['json']['ready'] is true
          - __verify_offline | length == 1
          - __verify_bare_dir['stat']['pw_name'] == 'root'
          - __verify_bare_dir['stat']['mode'] == '0755'
          - __verify_bare_files['files'] | length == 0
        fail_msg: >-
          ready {{ __verify_degraded['json'] }}, /data/rustfs3
          {{ __verify_bare_dir['stat']['pw_name'] }} {{ __verify_bare_dir['stat']['mode'] }},
          files {{ __verify_bare_files['files'] | map(attribute='path') | list }}

    - name: Stop RustFS before a second drive goes
      ansible.builtin.systemd_service:
        name: rustfs
        state: stopped

    - name: Unmount the drive /data/rustfs2 too
      ansible.builtin.command: umount /data/rustfs2
      changed_when: true

    - name: Start the unit without two drives
      ansible.builtin.systemd_service:
        name: rustfs
        state: started
        no_block: true

    # Exits at once and is restarted every 10 s: the node is down.
    - name: Wait for the distinct-disk refusal in the journal
      ansible.builtin.command: journalctl -u rustfs --no-pager --since "-60s"
      register: __verify_two_journal
      until: "'local erasure endpoints must use distinct physical disks' in __verify_two_journal['stdout']"
      retries: 15
      delay: 2
      changed_when: false

    - name: Probe /health/ready without two drives
      ansible.builtin.uri:
        url: "{{ __verify_url }}/health/ready"
        ca_path: "{{ __verify_ca }}"
      register: __verify_two_down
      failed_when: false

    - name: Assert two unmounted drives stop the node
      ansible.builtin.assert:
        that:
          - __verify_two_down['status'] == -1
          - "'/data/rustfs2, /data/rustfs3' in __verify_two_journal['stdout']"
        fail_msg: "readiness {{ __verify_two_down['status'] }}; journal does not name both drives"

    - name: Mount new empty drives at /data/rustfs2 and /data/rustfs3
      ansible.builtin.include_tasks: ../shared/tasks/mount_drives.yml
      vars:
        __verify_drives: [/data/rustfs2, /data/rustfs3]

    # A filesystem mounted after the start is not visible in the namespace
    # of the running process (here the unit is between two failed starts).
    - name: Restart RustFS to see the new mounts
      ansible.builtin.systemd_service:
        name: rustfs
        state: restarted
        no_block: true

    # The new filesystem roots are root:root, so RustFS cannot use them yet.
    # Two of four drives keep read quorum (ready), not write quorum.
    - name: Wait until the node is ready again, still without the drives
      ansible.builtin.uri:
        url: "{{ __verify_url }}/health/ready"
        ca_path: "{{ __verify_ca }}"
        status_code: [200, 503]
      register: __verify_remounted
      until: >-
        __verify_remounted['status'] == 200
        and (__verify_remounted['json']['details']['storage']['unavailableDrives']
             + __verify_remounted['json']['details']['storage']['missingDrives']) | length == 2
      retries: 30
      delay: 2

    - name: Read the running process before the role run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Keep the main PID before the role run
      ansible.builtin.set_fact:
        __verify_pid_degraded: "{{ __verify_proc_pid }}"

    # Its write-quorum wait passes once RustFS has taken in the drives.
    - name: Run the role with the new drives
      ansible.builtin.include_role:
        name: ansible-role-rustfs

    - name: Read the running process after the role run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Stat the new drives
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop: [/data/rustfs2, /data/rustfs3]
      loop_control:
        label: "{{ item }}"
      register: __verify_new_drives

    # RustFS notices the writable drives by itself, formats and heals them.
    - name: Wait until RustFS lists every drive online
      ansible.builtin.uri:
        url: "{{ __verify_url }}/health/ready"
        ca_path: "{{ __verify_ca }}"
        status_code: [200, 503]
      register: __verify_healed
      until: >-
        __verify_healed['status'] == 200
        and __verify_healed['json']['details']['storage']['unavailableDrives'] == []
        and __verify_healed['json']['details']['storage']['missingDrives'] == []
      retries: 30
      delay: 2

    - name: Assert the role took in the new drives without a restart
      vars:
        __verify_new_owners: >-
          {{ __verify_new_drives['results'] | map(attribute='stat') | map(attribute='pw_name') | list }}
        __verify_new_modes: >-
          {{ __verify_new_drives['results'] | map(attribute='stat') | map(attribute='mode') | list }}
      ansible.builtin.assert:
        that:
          - __verify_new_owners == ['rustfs', 'rustfs']
          - __verify_new_modes == ['0750', '0750']
          - __verify_proc_pid | int == __verify_pid_degraded | int
          - not __rustfs_restart_needed
          - __verify_healed['json']['details']['storage']['unavailableDrives'] == []
          - __verify_healed['json']['details']['storage']['missingDrives'] == []
        fail_msg: >-
          new drives {{ __verify_new_owners }} {{ __verify_new_modes }},
          main PID {{ __verify_pid_degraded }} -> {{ __verify_proc_pid }},
          ready {{ __verify_healed['json'] }}

# A manual install being adopted (spec 10.1 play 3, Review Focus 5).
- name: "Behaviour: unmanaged binary is refused"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create the scratch binary directory
      ansible.builtin.file:
        path: /opt/fakebin
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Place an unmanaged rustfs binary
      ansible.builtin.copy:
        content: "fake"
        dest: /opt/fakebin/rustfs
        owner: root
        group: root
        mode: "0755"

    - name: Stat the unmanaged binary
      ansible.builtin.stat:
        path: /opt/fakebin/rustfs
        follow: false
        checksum_algorithm: sha256
      register: __verify_fake_before

    - name: Record the host state
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Keep the state before the run
      ansible.builtin.set_fact:
        __verify_state_before: "{{ __verify_state }}"

    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_bin_dir: "/opt/fakebin"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted an unmanaged binary at the binary path"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "unmanaged"
            __verify_secret: "{{ rustfs_secret_key }}"

    - name: Stat the unmanaged binary again
      ansible.builtin.stat:
        path: /opt/fakebin/rustfs
        follow: false
        checksum_algorithm: sha256
      register: __verify_fake_after

    - name: Stat the versioned binary in the scratch directory
      ansible.builtin.stat:
        path: /opt/fakebin/rustfs-1.0.6-musl
        get_checksum: false
      register: __verify_fake_versioned

    - name: Record the host state after the refusal
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Assert the unmanaged binary and the host are untouched
      ansible.builtin.assert:
        that:
          - __verify_fake_after['stat']['isreg']
          - __verify_fake_after['stat']['checksum'] == __verify_fake_before['stat']['checksum']
          - not __verify_fake_versioned['stat']['exists']
          - __verify_state == __verify_state_before
        fail_msg: "the refused run changed the unmanaged binary or the host"

    - name: Remove the scratch binary directory
      ansible.builtin.file:
        path: /opt/fakebin
        state: absent

# A missing ReadWritePaths entry would make the unit fail with 226/NAMESPACE.
- name: "Behaviour: missing read-write path is refused"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Record the host state
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Keep the state before the run
      ansible.builtin.set_fact:
        __verify_state_before: "{{ __verify_state }}"

    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_systemd_read_write_paths: ["/var/lib/rustfs-missing"]

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a missing read-write path"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "/var/lib/rustfs-missing"
            __verify_secret: "{{ rustfs_secret_key }}"

    - name: Record the host state after the refusal
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Assert the refusal changed nothing
      ansible.builtin.assert:
        that:
          - __verify_state == __verify_state_before
        fail_msg: "host state before {{ __verify_state_before }}, after {{ __verify_state }}"

# Preflight P5 also compares with the running process: with the env file
# elsewhere (a new rustfs_env_file, a lost file), a changed erasure set size
# is still refused, and nothing is written.
- name: "Behaviour: a layout change is refused against the running process"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Record the host state
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Keep the state before the run
      ansible.builtin.set_fact:
        __verify_state_before: "{{ __verify_state }}"

    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_env_file: /etc/default/rustfs-elsewhere
            rustfs_extra_env:
              RUSTFS_ERASURE_SET_DRIVE_COUNT: "4"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a layout change without an env file to compare with"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: 'RUSTFS_ERASURE_SET_DRIVE_COUNT in the running process "unset", desired "4"'
            __verify_secret: "{{ rustfs_secret_key }}"

    - name: Stat the env file the refused run named
      ansible.builtin.stat:
        path: /etc/default/rustfs-elsewhere
        get_checksum: false
      register: __verify_env_elsewhere

    - name: Record the host state after the refusal
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Assert the refusal changed nothing
      ansible.builtin.assert:
        that:
          - __verify_state == __verify_state_before
          - not __verify_env_elsewhere['stat']['exists']
        fail_msg: "host state before {{ __verify_state_before }}, after {{ __verify_state }}"

# ------------------------------------------------------------------------------
# TLS on a running node
# ------------------------------------------------------------------------------

# Without the extra SAN the re-signed certificate drops a name of the one
# RustFS serves, so RustFS rejects the hot reload and keeps the old one: the
# role restarts the node ('tls'). Adding the SAN back keeps every name, so
# RustFS reloads it and the role restarts nothing.
- name: "Behaviour: a rejected certificate reload restarts the node"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the running process before the certificate change
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Keep the main PID before the certificate change
      ansible.builtin.set_fact:
        __verify_pid_cert: "{{ __verify_proc_pid }}"

    - name: Run the role without the extra SAN
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_tls_extra_sans: []

    - name: Read the running process after the rejected reload
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Read the certificate file after the rejected reload
      community.crypto.x509_certificate_info:
        path: /etc/rustfs/tls/rustfs_cert.pem
      register: __verify_cert_file

    - name: Read the served certificate after the rejected reload
      community.crypto.get_certificate:
        host: localhost
        port: 9000
      register: __verify_cert_served

    - name: Assert the node restarted onto the new certificate
      ansible.builtin.assert:
        that:
          - __rustfs_restart_needed
          - not __rustfs_restart_together
          - __rustfs_restart_reasons == ['tls']
          - __verify_proc_pid | int != __verify_pid_cert | int
          - "'DNS:rustfs.molecule.test' not in __verify_cert_file['subject_alt_name']"
          - __verify_cert_served['serial_number'] == __verify_cert_file['serial_number']
        fail_msg: >-
          reasons {{ __rustfs_restart_reasons | default('unset') }}, main PID
          {{ __verify_pid_cert }} -> {{ __verify_proc_pid }}, served serial
          {{ __verify_cert_served['serial_number'] }}, file serial {{ __verify_cert_file['serial_number'] }}

    - name: Keep the main PID after the restart
      ansible.builtin.set_fact:
        __verify_pid_cert: "{{ __verify_proc_pid }}"

    - name: Run the role with the extra SAN again
      ansible.builtin.include_role:
        name: ansible-role-rustfs

    - name: Read the running process after the accepted reload
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Read the certificate file after the accepted reload
      community.crypto.x509_certificate_info:
        path: /etc/rustfs/tls/rustfs_cert.pem
      register: __verify_cert_file

    - name: Read the served certificate after the accepted reload
      community.crypto.get_certificate:
        host: localhost
        port: 9000
      register: __verify_cert_served

    - name: Assert RustFS reloaded the certificate without a restart
      ansible.builtin.assert:
        that:
          - not __rustfs_restart_needed
          - __rustfs_restart_reasons == []
          - __verify_proc_pid | int == __verify_pid_cert | int
          - "'DNS:rustfs.molecule.test' in __verify_cert_file['subject_alt_name']"
          - __verify_cert_served['serial_number'] == __verify_cert_file['serial_number']
        fail_msg: >-
          reasons {{ __rustfs_restart_reasons | default('unset') }}, main PID
          {{ __verify_pid_cert }} -> {{ __verify_proc_pid }}, served serial
          {{ __verify_cert_served['serial_number'] }}, file serial {{ __verify_cert_file['serial_number'] }}

# RUSTFS_TRUST_SYSTEM_CA adds the OS store to ca.crt; the role's probes keep
# trusting ca.crt (the private CA of the node certificate), so the restart
# and its readiness wait succeed. Then back to the scenario value.
- name: "Behaviour: the probes keep ca.crt when the OS store is trusted too"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the running process before trusting the OS store
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Keep the main PID before trusting the OS store
      ansible.builtin.set_fact:
        __verify_pid_ca: "{{ __verify_proc_pid }}"

    - name: Run the role with rustfs_tls_trust_system_ca
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_tls_trust_system_ca: true

    - name: Read the running process with the OS store trusted
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the node restarted and the probes used ca.crt
      ansible.builtin.assert:
        that:
          - __rustfs_restart_reasons == ['RUSTFS_TRUST_SYSTEM_CA']
          - __verify_proc_pid | int != __verify_pid_ca | int
          - __rustfs_probe_ca == '/etc/rustfs/tls/ca.crt'
        fail_msg: >-
          reasons {{ __rustfs_restart_reasons | default('unset') }}, main PID
          {{ __verify_pid_ca }} -> {{ __verify_proc_pid }}, probe CA {{ __rustfs_probe_ca | default('unset') }}

    - name: Run the role with the scenario value again
      ansible.builtin.include_role:
        name: ansible-role-rustfs

# The other combination: a node certificate from a CA in the OS store (a
# public CA) and a ca.crt that did not sign it (a private CA for outbound
# targets). RustFS trusts both stores with rustfs_tls_trust_system_ca, so the
# probes must use the OS store, not ca.crt. Without the OS store the same
# certificate is refused before any restart. The generated material and the
# OS store are restored at the end.
- name: "Behaviour: the probes use the OS store when ca.crt does not sign the node certificate"
  hosts: all
  become: true
  gather_facts: false
  vars:
    __verify_os_ca_dir: /root/molecule-os-ca
    __verify_os_anchor: >-
      {{ '/usr/local/share/ca-certificates/molecule-os-ca.crt' if ansible_facts['os_family'] == 'Debian'
         else '/etc/pki/ca-trust/source/anchors/molecule-os-ca.crt' }}
    __verify_os_update: >-
      {{ ['update-ca-certificates', '--fresh'] if ansible_facts['os_family'] == 'Debian'
         else ['update-ca-trust', 'extract'] }}
  tasks:
    - name: Create the directory of the OS store test CA
      ansible.builtin.file:
        path: "{{ __verify_os_ca_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Keep the generated node certificate and key
      ansible.builtin.copy:
        src: "/etc/rustfs/tls/{{ item }}"
        dest: "{{ __verify_os_ca_dir }}/generated-{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: [rustfs_cert.pem, rustfs_key.pem]
      loop_control:
        label: "{{ item }}"

    - name: Create the key of the OS store test CA
      community.crypto.openssl_privatekey:
        path: "{{ __verify_os_ca_dir }}/ca.key"
        type: ECC
        curve: secp384r1
        mode: "0600"

    - name: Create the CSR of the OS store test CA
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ __verify_os_ca_dir }}/ca.key"
        common_name: "Molecule OS Store CA"
        use_common_name_for_san: false
        basic_constraints:
          - "CA:TRUE"
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
        key_usage_critical: true
      register: __verify_os_ca_csr
      changed_when: false

    - name: Self-sign the OS store test CA
      community.crypto.x509_certificate:
        path: "{{ __verify_os_ca_dir }}/ca.crt"
        csr_content: "{{ __verify_os_ca_csr['csr'] }}"
        privatekey_path: "{{ __verify_os_ca_dir }}/ca.key"
        provider: selfsigned
        mode: "0644"

    - name: Add the test CA to the OS store
      ansible.builtin.copy:
        src: "{{ __verify_os_ca_dir }}/ca.crt"
        dest: "{{ __verify_os_anchor }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Rebuild the OS store with the test CA
      ansible.builtin.command:
        argv: "{{ __verify_os_update }}"
      changed_when: true

    - name: Create a node key for the OS store test CA
      community.crypto.openssl_privatekey:
        path: "{{ __verify_os_ca_dir }}/node.key"
        type: ECC
        curve: secp384r1
        mode: "0600"

    # The names of the generated certificate, so RustFS accepts the reload.
    - name: Create a node CSR for the OS store test CA
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ __verify_os_ca_dir }}/node.key"
        common_name: localhost
        subject_alt_name:
          - "DNS:localhost"
          - "DNS:{{ inventory_hostname }}"
          - "IP:127.0.0.1"
          - "DNS:rustfs.molecule.test"
        use_common_name_for_san: false
        extended_key_usage:
          - serverAuth
      register: __verify_os_node_csr
      changed_when: false

    - name: Issue the node certificate from the OS store test CA
      community.crypto.x509_certificate:
        path: "{{ __verify_os_ca_dir }}/node.crt"
        csr_content: "{{ __verify_os_node_csr['csr'] }}"
        provider: ownca
        ownca_path: "{{ __verify_os_ca_dir }}/ca.crt"
        ownca_privatekey_path: "{{ __verify_os_ca_dir }}/ca.key"
        mode: "0644"

    # ca.crt stays the generated CA, which did not sign this certificate.
    - name: Place the node certificate of the OS store test CA
      ansible.builtin.copy:
        src: "{{ __verify_os_ca_dir }}/{{ item['src'] }}"
        dest: "/etc/rustfs/tls/{{ item['dest'] }}"
        remote_src: true
        owner: root
        group: "{{ item['group'] }}"
        mode: "{{ item['mode'] }}"
      loop:
        - {src: node.crt, dest: rustfs_cert.pem, group: root, mode: "0644"}
        - {src: node.key, dest: rustfs_key.pem, group: rustfs, mode: "0640"}
      loop_control:
        label: "{{ item['dest'] }}"

    - name: Read the running process before the OS store run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Keep the main PID before the OS store run
      ansible.builtin.set_fact:
        __verify_pid_os: "{{ __verify_proc_pid }}"

    - name: Run the role in BYO mode with rustfs_tls_trust_system_ca
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_tls_generate_certs: false
        rustfs_tls_trust_system_ca: true

    - name: Read the running process with the OS store trusted
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the node restarted and the probes used the OS store
      ansible.builtin.assert:
        that:
          - "'RUSTFS_TRUST_SYSTEM_CA' in __rustfs_restart_reasons"
          - __verify_proc_pid | int != __verify_pid_os | int
          - __rustfs_probe_ca == ''
        fail_msg: >-
          reasons {{ __rustfs_restart_reasons | default('unset') }}, main PID
          {{ __verify_pid_os }} -> {{ __verify_proc_pid }}, probe CA {{ __rustfs_probe_ca | default('unset') }}

    - name: Keep the main PID with the OS store trusted
      ansible.builtin.set_fact:
        __verify_pid_os: "{{ __verify_proc_pid }}"

    - name: Run the role without the OS store expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_tls_generate_certs: false

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a node certificate that ca.crt does not sign"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: >-
              The certificate /etc/rustfs/tls/rustfs_cert.pem of {{ inventory_hostname }}
              chains to none of the CA stores RustFS trusts here (/etc/rustfs/tls/ca.crt)
            __verify_secret: "{{ rustfs_secret_key }}"

    - name: Read the running process after the refusal
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the refusal restarted nothing
      ansible.builtin.assert:
        that:
          - __verify_proc_pid | int == __verify_pid_os | int
        fail_msg: "main PID {{ __verify_pid_os }} -> {{ __verify_proc_pid }}"

    - name: Put the generated node certificate and key back
      ansible.builtin.copy:
        src: "{{ __verify_os_ca_dir }}/generated-{{ item['name'] }}"
        dest: "/etc/rustfs/tls/{{ item['name'] }}"
        remote_src: true
        owner: root
        group: "{{ item['group'] }}"
        mode: "{{ item['mode'] }}"
      loop:
        - {name: rustfs_cert.pem, group: root, mode: "0644"}
        - {name: rustfs_key.pem, group: rustfs, mode: "0640"}
      loop_control:
        label: "{{ item['name'] }}"

    - name: Remove the test CA from the OS store
      ansible.builtin.file:
        path: "{{ __verify_os_anchor }}"
        state: absent

    - name: Rebuild the OS store without the test CA
      ansible.builtin.command:
        argv: "{{ __verify_os_update }}"
      changed_when: true

    - name: Remove the files of the OS store test CA
      ansible.builtin.file:
        path: "{{ __verify_os_ca_dir }}"
        state: absent

    - name: Run the role with the scenario values again
      ansible.builtin.include_role:
        name: ansible-role-rustfs

    - name: Assert the probes use ca.crt again
      ansible.builtin.assert:
        that:
          - __rustfs_probe_ca == '/etc/rustfs/tls/ca.crt'
        fail_msg: "probe CA {{ __rustfs_probe_ca | default('unset') }}"

# The generated files used as operator-supplied material: the BYO checks
# (owner and mode, validity, EKU, SAN, key match) pass on a running node
# and nothing restarts.
- name: "Behaviour: BYO mode accepts the material in place"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the running process before the BYO run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Keep the main PID before the BYO run
      ansible.builtin.set_fact:
        __verify_pid_byo: "{{ __verify_proc_pid }}"

    - name: Run the role in BYO mode
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_tls_generate_certs: false

    - name: Read the running process after the BYO run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the BYO run restarted nothing
      ansible.builtin.assert:
        that:
          - not __rustfs_restart_needed
          - __verify_proc_pid | int == __verify_pid_byo | int
        fail_msg: "main PID {{ __verify_pid_byo }} -> {{ __verify_proc_pid }}, reasons {{ __rustfs_restart_reasons | default('unset') }}"

# ------------------------------------------------------------------------------
# Binary paths
# ------------------------------------------------------------------------------

# The kernel reports the canonical path of a running binary, so a
# rustfs_bin_dir behind a symlink must still compare as the same binary:
# one restart to move there, none on the next run. The copy there is the
# verified binary with its digest file, so nothing is downloaded. Then the
# digest file of the default binary is removed: the role no longer trusts
# that binary, downloads and verifies it again and restarts onto it.
- name: "Behaviour: a symlinked rustfs_bin_dir restarts once"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create the real binary directory
      ansible.builtin.file:
        path: /opt/rustfs-bin-real
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Link the binary directory to it
      ansible.builtin.file:
        src: /opt/rustfs-bin-real
        dest: /opt/rustfs-bin
        state: link

    - name: Copy the verified binary and its digest file there
      ansible.builtin.copy:
        src: "/usr/local/bin/{{ item['name'] }}"
        dest: "/opt/rustfs-bin-real/{{ item['name'] }}"
        remote_src: true
        owner: root
        group: root
        mode: "{{ item['mode'] }}"
      loop:
        - {name: rustfs-1.0.6-musl, mode: "0755"}
        - {name: rustfs-1.0.6-musl.sha256, mode: "0644"}
      loop_control:
        label: "{{ item['name'] }}"

    - name: Run the role with the symlinked binary directory
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_bin_dir: /opt/rustfs-bin

    - name: Read the running process in the symlinked directory
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the node moved to the symlinked directory
      ansible.builtin.assert:
        that:
          - __rustfs_restart_needed
          - "'binary' in __rustfs_restart_reasons"
          - __verify_proc_exe == '/opt/rustfs-bin-real/rustfs-1.0.6-musl'
        fail_msg: "exe {{ __verify_proc_exe }}, reasons {{ __rustfs_restart_reasons | default('unset') }}"

    - name: Keep the main PID in the symlinked directory
      ansible.builtin.set_fact:
        __verify_pid_bin: "{{ __verify_proc_pid }}"

    - name: Run the role with the symlinked binary directory again
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_bin_dir: /opt/rustfs-bin

    - name: Read the running process after the second run
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the second run did not restart
      ansible.builtin.assert:
        that:
          - not __rustfs_restart_needed
          - __verify_proc_pid | int == __verify_pid_bin | int
        fail_msg: "main PID {{ __verify_pid_bin }} -> {{ __verify_proc_pid }}, reasons {{ __rustfs_restart_reasons | default('unset') }}"

    - name: Remove the digest file of the default versioned binary
      ansible.builtin.file:
        path: /usr/local/bin/rustfs-1.0.6-musl.sha256
        state: absent

    - name: Run the role with the default binary directory
      ansible.builtin.include_role:
        name: ansible-role-rustfs

    - name: Read the running process back in the default directory
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Stat the default versioned binary again
      ansible.builtin.stat:
        path: /usr/local/bin/rustfs-1.0.6-musl
        checksum_algorithm: sha256
      register: __verify_bin_after

    - name: Read the new digest file
      ansible.builtin.slurp:
        src: /usr/local/bin/rustfs-1.0.6-musl.sha256
      register: __verify_digest_after

    # Only the download block writes the digest file. The verified binary
    # equals the one on disk here, so copy leaves the file in place.
    - name: Assert the untrusted binary was downloaded and verified again
      ansible.builtin.assert:
        that:
          - (__verify_digest_after['content'] | b64decode | trim) == __verify_bin_after['stat']['checksum']
          - __verify_proc_exe == '/usr/local/bin/rustfs-1.0.6-musl'
          - "'binary' in __rustfs_restart_reasons"
        fail_msg: >-
          digest {{ __verify_digest_after['content'] | b64decode | trim }} vs
          {{ __verify_bin_after['stat']['checksum'] }}, exe {{ __verify_proc_exe }},
          reasons {{ __rustfs_restart_reasons | default('unset') }}

    - name: Remove the symlinked binary directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/rustfs-bin
        - /opt/rustfs-bin-real
      loop_control:
        label: "{{ item }}"

# rustfs_service_state and rustfs_service_enabled (spec 10.1 play 4). The
# service is stopped, so nothing restarts.
- name: "Behaviour: stopped and disabled, then back"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stop and disable RustFS
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_service_state: "stopped"
        rustfs_service_enabled: false

    - name: Gather service facts of the stopped service
      ansible.builtin.service_facts:

    - name: Record the host state of the stopped service
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Assert RustFS is stopped and disabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['rustfs.service']['state'] in ['stopped', 'inactive']
          - ansible_facts['services']['rustfs.service']['status'] == 'disabled'
          - __verify_state['main_pid'] | int == 0
        fail_msg: "rustfs.service is {{ ansible_facts['services']['rustfs.service'] }}, main PID {{ __verify_state['main_pid'] }}"

    - name: Run the role with the default service state
      ansible.builtin.include_role:
        name: ansible-role-rustfs

    - name: Gather service facts of the restored service
      ansible.builtin.service_facts:

    - name: Probe /health/ready of the restored service
      ansible.builtin.uri:
        url: "https://localhost:9000/health/ready"
        ca_path: /etc/rustfs/tls/ca.crt
      register: __verify_ready_back

    - name: Read the running process of the restored service
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert RustFS is running, enabled and ready again
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['rustfs.service']['state'] == 'running'
          - ansible_facts['services']['rustfs.service']['status'] == 'enabled'
          - __verify_ready_back['status'] == 200 and __verify_ready_back['json']['ready'] is true
          - __rustfs_state == 'inactive'
          - not __rustfs_restart_needed
        fail_msg: >-
          rustfs.service is {{ ansible_facts['services']['rustfs.service'] }},
          ready {{ __verify_ready_back['json'] | default(__verify_ready_back['status']) }},
          probed state {{ __rustfs_state | default('unset') }}

    - name: Assert the restored process runs the default log level
      ansible.builtin.assert:
        that:
          - __verify_proc_env['RUSTFS_OBS_LOGGER_LEVEL'] == 'info'
      no_log: true

# README "Rotating secrets" (single node): a new rustfs_iam_master_key
# without the running key in RUSTFS_IAM_MASTER_KEY_OLD_KEYS is refused
# before anything changes (the IAM data encrypted with it would become
# unreadable); with the old key listed it is a rolling restart. The play
# then rotates back the same way and drops the old key, so the host ends in
# the scenario state (the CI check-mode converge runs against it).
- name: "Behaviour: an IAM master key change must keep the old key"
  hosts: all
  become: true
  gather_facts: false
  vars:
    __verify_iam_key_1: "molecule-iam-master-key-0123456789"
    __verify_iam_key_2: "molecule-iam-master-key-rotated-0123456789"
  tasks:
    - name: Record the host state
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Keep the state before the run
      ansible.builtin.set_fact:
        __verify_state_before: "{{ __verify_state }}"

    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_iam_master_key: "{{ __verify_iam_key_2 }}"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role dropped the running IAM master key"
      rescue:
        - name: Check the refusal names the problem
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs-default: old key dropped"
            __verify_secret: "{{ __verify_iam_key_1 }}"

        - name: Check the refusal does not show the new key
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "RUSTFS_IAM_MASTER_KEY_OLD_KEYS"
            __verify_secret: "{{ __verify_iam_key_2 }}"

    - name: Record the host state after the refusal
      ansible.builtin.include_tasks: ../shared/tasks/record_state.yml

    - name: Assert the refusal changed nothing
      ansible.builtin.assert:
        that:
          - __verify_state == __verify_state_before
        fail_msg: "host state before {{ __verify_state_before }}, after {{ __verify_state }}"

    - name: Run the role with the new key and the old key listed
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_iam_master_key: "{{ __verify_iam_key_2 }}"
        rustfs_extra_secret_env:
          RUSTFS_IAM_MASTER_KEY_OLD_KEYS: "{{ __verify_iam_key_1 }}"

    - name: Read the running process with the new key
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the node restarted in the rolling path with both keys
      ansible.builtin.assert:
        that:
          - __rustfs_restart_needed
          - not __rustfs_restart_together
          - "'RUSTFS_IAM_MASTER_KEY' in __rustfs_restart_reasons"
          - __verify_proc_pid | int != __verify_state_before['main_pid'] | int
          - __verify_proc_env['RUSTFS_IAM_MASTER_KEY'] == __verify_iam_key_2
          - __verify_proc_env['RUSTFS_IAM_MASTER_KEY_OLD_KEYS'] == __verify_iam_key_1
        fail_msg: "reasons {{ __rustfs_restart_reasons | default('unset') }}"
      no_log: true

    - name: Rotate back with the new key listed
      ansible.builtin.include_role:
        name: ansible-role-rustfs
      vars:
        rustfs_extra_secret_env:
          RUSTFS_IAM_MASTER_KEY_OLD_KEYS: "{{ __verify_iam_key_2 }}"

    # Dropping an old key is not a change of the current key.
    - name: Run the role with the scenario variables again
      ansible.builtin.include_role:
        name: ansible-role-rustfs

    - name: Read the running process in the scenario state
      ansible.builtin.include_tasks: ../shared/tasks/read_process.yml

    - name: Assert the node runs the scenario key without old keys
      ansible.builtin.assert:
        that:
          - __verify_proc_env['RUSTFS_IAM_MASTER_KEY'] == __verify_iam_key_1
          - "'RUSTFS_IAM_MASTER_KEY_OLD_KEYS' not in __verify_proc_env"
        fail_msg: "the node does not run the scenario IAM master key"
      no_log: true
