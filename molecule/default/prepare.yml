---
# Prepare the default container before the role runs.
# Bootstraps Python, creates the extra sandbox path
# of rustfs_systemd_read_write_paths and mounts a tmpfs at each of the four
# data dirs, so the role runs with its default rustfs_require_mounted_drives.
# Nothing RustFS-specific: the role creates the user, installs its package
# dependencies (python3-cryptography among them) and the binary itself.

- name: Prepare default container
  hosts: all
  gather_facts: false
  tasks:
    - name: Detect available package manager
      ansible.builtin.raw: command -v apt-get >/dev/null 2>&1 && echo apt || echo dnf
      register: __verify_pkg_mgr
      changed_when: false

    - name: Bootstrap Python (Debian/Ubuntu)
      ansible.builtin.raw: >-
        apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends python3 python3-apt
      changed_when: true
      when: "'apt' in __verify_pkg_mgr['stdout']"

    - name: Bootstrap Python (RHEL/Rocky)
      ansible.builtin.raw: dnf install -y python3
      changed_when: true
      when: "'dnf' in __verify_pkg_mgr['stdout']"

    - name: Gather facts after bootstrap
      ansible.builtin.setup:

    # Must exist before the role runs (preflight P4).
    - name: Create the extra read-write path
      ansible.builtin.file:
        path: /var/lib/rustfs-extra
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mount the four test drives
      ansible.builtin.include_tasks: ../shared/tasks/mount_drives.yml
      vars:
        __verify_drives: [/data/rustfs0, /data/rustfs1, /data/rustfs2, /data/rustfs3]
