---
# Verify the render scenario without starting RustFS.
# Play 1 includes the role with public: true (render mode), so the derived
# __rustfs_* values and the validate facts are visible here, then asserts
# them; task-level vars override the scenario group_vars per case. It gathers
# facts, which the later plays reuse. The negative plays follow it.

- name: Verify derived values
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include rustfs role with public vars
      ansible.builtin.include_role:
        name: ansible-role-rustfs
        public: true

    - name: Assert derived values of the render layout
      ansible.builtin.assert:
        that:
          - __rustfs_volume_paths | type_debug == 'list'
          - __rustfs_volume_paths == ['/data/rustfs0', '/data/rustfs1', '/data/rustfs2', '/data/rustfs3']
          - __rustfs_volume_hosts == ['rustfs-render1', 'rustfs-render2', 'rustfs-render3', 'rustfs-render4']
          - rustfs_data_dirs == __rustfs_volume_paths
          - __rustfs_distributed | bool
          - __rustfs_port == '9000'
          - rustfs_node_address == 'rustfs-render1'
          - __rustfs_node_url == 'https://rustfs-render1:9000'
          - __rustfs_peer_urls | map(attribute='name') | list == ['rustfs-render2', 'rustfs-render3', 'rustfs-render4']
          - __rustfs_peer_urls[0]['url'] == 'https://rustfs-render2:9000'
          - (__rustfs_env | list)[0] == 'RUSTFS_VOLUMES'
          - __rustfs_env['RUSTFS_TLS_RELOAD_ENABLE'] == 'true'
          - __rustfs_env['RUSTFS_OBS_LOG_STDOUT_ENABLED'] == 'true'
          - "'RUSTFS_UNSAFE_BYPASS_DISK_CHECK' not in __rustfs_env"
          - __rustfs_managed_keys.split(',') | length == (__rustfs_env | length) + (__rustfs_secret_env | length) + 2
          - __rustfs_capabilities == ''
        fail_msg: "derived values of the render layout are wrong"

    - name: Assert the IAM master key reaches the secret env only
      ansible.builtin.assert:
        that:
          - (__rustfs_secret_env | list)[:4] == ['RUSTFS_ACCESS_KEY', 'RUSTFS_SECRET_KEY', 'RUSTFS_RPC_SECRET', 'RUSTFS_IAM_MASTER_KEY']
          - "'RUSTFS_IAM_MASTER_KEY_OLD_KEYS' in __rustfs_secret_env"
          - "'RUSTFS_IAM_MASTER_KEY' not in __rustfs_env"
          - "'RUSTFS_IAM_MASTER_KEY' in __rustfs_reserved_env"
        fail_msg: "RUSTFS_IAM_MASTER_KEY is not rendered from rustfs_iam_master_key into the secret env"

    - name: Assert no IAM master key without the variable
      vars:
        rustfs_iam_master_key: ""
      ansible.builtin.assert:
        that: "'RUSTFS_IAM_MASTER_KEY' not in __rustfs_secret_env"
        fail_msg: "an empty rustfs_iam_master_key still renders RUSTFS_IAM_MASTER_KEY"

    # No scenario that starts RustFS sets it (their tmpfs drives pass the
    # distinct-disk check), so its rendering is checked here.
    - name: Assert the distinct-disk check bypass when it is set
      vars:
        rustfs_unsafe_bypass_disk_check: true
      ansible.builtin.assert:
        that: __rustfs_env['RUSTFS_UNSAFE_BYPASS_DISK_CHECK'] | default('') == 'true'
        fail_msg: "rustfs_unsafe_bypass_disk_check: true does not render RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true"

    - name: Assert zero padding and pool de-duplication
      vars:
        rustfs_volumes:
          - "https://n{01...04}.example.com/mnt/disk{01...12}"
          - "https://n{05...08}.example.com/mnt/disk{01...12}"
      ansible.builtin.assert:
        that:
          - __rustfs_volume_paths | length == 12
          - __rustfs_volume_paths[0] == '/mnt/disk01'
          - __rustfs_volume_paths[-1] == '/mnt/disk12'
          - __rustfs_volume_hosts | length == 8
          - __rustfs_volume_hosts[0] == 'n01.example.com'
          - __rustfs_volume_hosts[-1] == 'n08.example.com'
        fail_msg: "zero-padded ranges or pool de-duplication are wrong"

    - name: Assert explicit checksum wins
      vars:
        rustfs_checksum: "{{ 'a' * 64 }}"
      ansible.builtin.assert:
        that: __rustfs_checksum_arg == 'sha256:' ~ ('a' * 64)
        fail_msg: "rustfs_checksum does not take precedence: {{ __rustfs_checksum_arg }}"

    - name: Assert pinned digest for the default version
      ansible.builtin.assert:
        that:
          - rustfs_arch in ['x86_64', 'aarch64']
          - __rustfs_checksum_arg == 'sha256:' ~ __rustfs_checksums['1.0.6'][rustfs_arch ~ '-musl']
          - __rustfs_download_url == 'https://github.com/rustfs/rustfs/releases/download/1.0.6/rustfs-linux-' ~ rustfs_arch ~ '-musl-v1.0.6.zip'
        fail_msg: "pinned digest or download URL of the default version is wrong: {{ __rustfs_checksum_arg }} {{ __rustfs_download_url }}"

    - name: Assert SHA256SUMS fallback on a mirror
      vars:
        rustfs_version: "1.0.5"
        rustfs_download_base_url: "https://mirror.example.com/rustfs"
      ansible.builtin.assert:
        that: __rustfs_checksum_arg == 'sha256:https://mirror.example.com/rustfs/1.0.5/SHA256SUMS'
        fail_msg: "SHA256SUMS fallback is wrong: {{ __rustfs_checksum_arg }}"

    - name: Assert node address default for a bound listener
      vars:
        rustfs_volumes: ["/data/rustfs0"]
        rustfs_address: "127.0.0.2:9000"
      ansible.builtin.assert:
        that: rustfs_node_address == '127.0.0.2'
        fail_msg: "rustfs_node_address for a bound listener is {{ rustfs_node_address }}"

    - name: Assert node address default for a bound IPv6 listener
      vars:
        rustfs_volumes: ["/data/rustfs0"]
        rustfs_address: "[::1]:9000"
      ansible.builtin.assert:
        that:
          - rustfs_node_address == '::1'
          - __rustfs_node_is_ip | bool
        fail_msg: "rustfs_node_address for a bound IPv6 listener is {{ rustfs_node_address }}"

    - name: Assert localhost for a wildcard listener
      vars:
        rustfs_volumes: ["/data/rustfs0"]
      ansible.builtin.assert:
        that: rustfs_node_address == 'localhost'
        fail_msg: "rustfs_node_address for a wildcard listener is {{ rustfs_node_address }}"

    # Volume hosts lose the brackets of an IPv6 literal, so they compare with
    # rustfs_node_address; the SAN is an IP SAN without brackets.
    - name: Assert IPv6 literal volume hosts
      vars:
        rustfs_volumes: ["https://[fd00::{1...4}]:9000/data/rustfs{0...3}"]
        rustfs_node_address: "fd00::1"
      ansible.builtin.assert:
        that:
          - __rustfs_volume_hosts == ['fd00::1', 'fd00::2', 'fd00::3', 'fd00::4']
          - rustfs_node_address in __rustfs_volume_hosts
          - __rustfs_node_is_ip | bool
          - "'IP:fd00::1' in __rustfs_tls_sans"
        fail_msg: "IPv6 volume hosts {{ __rustfs_volume_hosts }}, SANs {{ __rustfs_tls_sans }}"

# ------------------------------------------------------------------------------
# Negative plays: each case includes the role inside block / rescue and checks
# the refusal with molecule/shared/tasks/expect_failure.yml (the message holds
# the expected text and never the secret). One play per case; gather_facts is
# false because the facts gathered by the first play stay cached.
# ------------------------------------------------------------------------------

# The public upstream default is refused.
- name: "Negative: default access key"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_access_key: "rustfsadmin"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted the default access key"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_access_key"
            __verify_secret: ""

# A root secret key is required.
- name: "Negative: empty secret key"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_secret_key: ""

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted an empty secret key"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_secret_key"
            __verify_secret: ""

# The message must not echo the secret.
- name: "Negative: RPC secret equal to the secret key"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_rpc_secret: "molecule-secret-key-0123456789"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted an RPC secret equal to the secret key"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_rpc_secret"
            __verify_secret: "molecule-secret-key-0123456789"

# The render layout is distributed, so the RPC secret is required.
- name: "Negative: missing RPC secret in distributed mode"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_rpc_secret: ""

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a missing RPC secret in distributed mode"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_rpc_secret"
            __verify_secret: ""

# The render layout is distributed, so the IAM master key is required.
- name: "Negative: missing IAM master key in distributed mode"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_iam_master_key: ""

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a missing IAM master key in distributed mode"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_iam_master_key"
            __verify_secret: ""

# At least 32 characters; the message must not echo the key.
- name: "Negative: short IAM master key"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_iam_master_key: "molecule-short-iam-key"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a short IAM master key"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_iam_master_key"
            __verify_secret: "molecule-short-iam-key"

# Secrets are rendered as KEY="value"; the message must not echo the secret.
- name: "Negative: backslash in a secret"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_secret_key: 'molecule-secret\key-0123456789'

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a backslash in the secret key"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "backslash"
            __verify_secret: 'molecule-secret\key-0123456789'

# RustFS trims the secret key, so a vaulted value with a leading space would
# differ from the one RustFS uses.
- name: "Negative: secret key with surrounding whitespace"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_secret_key: " molecule-secret-key-0123456789"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a secret key with a leading space"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_secret_key: the value contains"
            __verify_secret: " molecule-secret-key-0123456789"

# RUSTFS_IAM_MASTER_KEY_OLD_KEYS is split on commas: a key with a comma could
# never be listed as an old key.
- name: "Negative: comma in the IAM master key"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_iam_master_key: "molecule-iam-master-key,0123456789"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted an IAM master key with a comma"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "without a comma"
            __verify_secret: "molecule-iam-master-key,0123456789"

# Without a pinned digest or rustfs_checksum the zip and SHA256SUMS would
# both come from a plain HTTP origin.
- name: "Negative: plain HTTP mirror without a digest"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_version: "1.0.5"
            rustfs_download_base_url: "http://mirror.example.com/rustfs"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a plain HTTP mirror without a digest"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "is not an https:// URL"
            __verify_secret: ""

# validate.yml repeats the choices of meta/argument_specs.yml for runs
# without argument validation.
- name: "Negative: choice variable without argument validation"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
            rolespec_validate: false
          vars:
            rustfs_service_state: "restarted"

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted rustfs_service_state restarted"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_service_state 'restarted' (started, stopped)"
            __verify_secret: ""

# {0..3} is shell syntax; RustFS needs {0...3}.
- name: "Negative: two-dot ellipsis"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_volumes: ["https://rustfs-render{1...4}:9000/data/rustfs{0..3}"]

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a two-dot ellipsis"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "{0...3}"
            __verify_secret: ""

# TLS on means https:// volumes.
- name: "Negative: http volumes with TLS on"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_volumes: ["http://rustfs-render{1...4}:9000/data/rustfs{0...3}"]

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted http volumes with TLS on"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "https://"
            __verify_secret: ""

# An explicit volume port must be the rustfs_address port.
- name: "Negative: URL port differing from the listener"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_volumes: ["https://rustfs-render{1...4}:9100/data/rustfs{0...3}"]

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a volume port that differs from the listener"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "9100"
            __verify_secret: ""

# Keys the role owns are refused.
- name: "Negative: reserved key in rustfs_extra_env"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_extra_env: {RUSTFS_ADDRESS: ":9100"}

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a reserved key in rustfs_extra_env"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "RUSTFS_ADDRESS"
            __verify_secret: ""

# The IAM master key has its own variable; the message must not echo it.
- name: "Negative: IAM master key in rustfs_extra_secret_env"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_extra_secret_env: {RUSTFS_IAM_MASTER_KEY: "molecule-iam-master-key-0123456789"}

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted RUSTFS_IAM_MASTER_KEY in rustfs_extra_secret_env"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "RUSTFS_IAM_MASTER_KEY"
            __verify_secret: "molecule-iam-master-key-0123456789"

# Values must be strings.
- name: "Negative: boolean value in rustfs_extra_env"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
