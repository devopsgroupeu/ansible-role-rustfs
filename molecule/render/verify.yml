        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs_ready_retries"
            __verify_secret: ""

# Refused by role argument validation (argument_specs choices), before
# validate.yml runs.
- name: "Negative: rustfs_libc glibc"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
