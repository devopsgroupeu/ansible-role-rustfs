        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "quote"
            __verify_secret: ""

# PrivateTmp hides /tmp from the service.
- name: "Negative: data dir under /tmp"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_data_dirs: ["/tmp/rustfs0", "/data/rustfs1", "/data/rustfs2", "/data/rustfs3"]

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a data dir under /tmp"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "/tmp"
            __verify_secret: ""

# RustFS rejects nested drives.
- name: "Negative: nested data dirs"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_data_dirs: ["/data/a", "/data/a/b", "/data/c", "/data/d"]

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted nested data dirs"
      rescue:
        - name: Check the refusal
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "/data/a/b"
            __verify_secret: ""

# Short inventory names with FQDN volumes: rustfs_node_address stays at its
# default rustfs-render1. Both values must be in the message.
- name: "Negative: node address not among the volume hosts"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
            name: ansible-role-rustfs
          vars:
            rustfs_volumes: ["https://node{1...4}.example.com:9000/data/rustfs{0...3}"]

        - name: Fail because the role did not refuse
          ansible.builtin.fail:
            msg: "role accepted a node address that is not among the volume hosts"
      rescue:
        - name: Check the refusal names the volume hosts
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "node1.example.com"
            __verify_secret: ""

        - name: Check the refusal names the node address
          ansible.builtin.include_tasks: ../shared/tasks/expect_failure.yml
          vars:
            __verify_expect: "rustfs-render1"
            __verify_secret: ""

# Every wait needs at least one attempt.
- name: "Negative: rustfs_ready_retries 0"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the role expecting a refusal
      block:
        - name: Include rustfs role
          ansible.builtin.include_role:
